[package]
name = "vsift-infrastructure"
description = "Infrastructure adapters for VSift"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true

[features]
# Lets VSIFT_FAULT_POINT stop the process at a named commit boundary (ADR 0020)
# for crash tests and campaigns. Development only: the crate refuses to compile
# it without debug assertions, and the governance check refuses it anywhere but
# a development dependency.
fault-injection = []
# The Ubuntu 24.04 / ext4 crash campaign (ADR 0020, tools/p10-crash-campaign).
# With VSIFT_CAMPAIGN_NEGATIVE_CONTROL=1 a durable commit skips every
# synchronisation after its pointer rename (the session directory's and the
# chain checkpoint's flush): the negative control that shows the campaign
# can see a lost acknowledgement. Development only,
# like fault-injection: refused without debug assertions and, by the
# governance check, anywhere but a development dependency or the campaign
# tool's own non-default feature.
durability-campaign = []
# P13 managed-install test hooks: a loopback publisher route (a local test
# server on 127.0.0.1, optionally through an explicit proxy) and an injected
# stage-write failure for the disk-full case. The route bypasses the
# reviewed catalogue's trust anchor, so it is development only, like
# fault-injection: the crate refuses to compile it without debug assertions,
# and the governance check refuses it anywhere but a development dependency.
install-test-hooks = []

# A standard-library-only stand-in for FFmpeg, FFprobe and whisper-cli that the
# P13 compatibility-smoke tests stage and run (tests/p13_smoke_executor.rs,
# which finds it through CARGO_BIN_EXE_vsift-smoke-fixture). The smoke passes a
# closed argument list and an empty environment, so the tests cannot re-invoke
# their own harness binary as tests/process_supervisor.rs does; and a small
# binary keeps each staged copy cheap to hash. It is never packaged or shipped.
[[bin]]
name = "vsift-smoke-fixture"
path = "testbin/smoke_fixture_tool.rs"
test = false
doc = false
bench = false

# The P13 transaction tests drive the real transport through the
# development-only loopback route (install-test-hooks). They build whenever a
# workspace test run enables the feature (the engine crate's development
# dependency does), and a release-mode run of this crate alone, which the
# feature would refuse, skips them. Run them alone with
# `cargo test -p vsift-infrastructure --features install-test-hooks --test p13_install_transaction`.
[[test]]
name = "p13_install_transaction"
required-features = ["install-test-hooks"]

[dependencies]
cap-fs-ext.workspace = true
cap-std.workspace = true
flate2.workspace = true
getrandom.workspace = true
lzma-rust2.workspace = true
native-tls.workspace = true
process-wrap.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tar.workspace = true
tokio.workspace = true
vsift-application.workspace = true
vsift-domain.workspace = true

[dev-dependencies]
# Already a workspace development dependency; here it proves that the stored
# transcript record matches its published bundle schema.
jsonschema.workspace = true
lzma-rust2 = { workspace = true, features = ["encoder"] }
proptest.workspace = true

[target.'cfg(windows)'.dependencies]
windows-acl.workspace = true


[target.'cfg(unix)'.dependencies]
rustix.workspace = true

[lints]
workspace = true
