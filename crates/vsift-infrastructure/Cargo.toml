[package]
name = "vsift-infrastructure"
description = "Infrastructure adapters for VSift"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true

[features]
# Lets VSIFT_FAULT_POINT stop the process at a named commit boundary (ADR 0020)
# for crash tests and campaigns. Development only: the crate refuses to compile
# it without debug assertions, and the governance check refuses it anywhere but
# a development dependency.
fault-injection = []

[dependencies]
cap-fs-ext.workspace = true
cap-std.workspace = true
flate2.workspace = true
getrandom.workspace = true
lzma-rust2.workspace = true
process-wrap.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tar.workspace = true
tokio.workspace = true
vsift-application.workspace = true
vsift-domain.workspace = true

[dev-dependencies]
# Already a workspace development dependency; here it proves that the stored
# transcript record matches its published bundle schema.
jsonschema.workspace = true
lzma-rust2 = { workspace = true, features = ["encoder"] }
proptest.workspace = true

[target.'cfg(windows)'.dependencies]
windows-acl.workspace = true


[target.'cfg(unix)'.dependencies]
rustix.workspace = true

[lints]
workspace = true
