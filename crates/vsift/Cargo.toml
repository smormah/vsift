[package]
name = "vsift"
description = "Embeddable VSift engine: the one library API every VSift host uses"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true

[dependencies]
# Already a dependency of every layer below; the engine uses it directly for
# the per-request tasks and the event channel of a worker batch (P11 PR 4).
tokio.workspace = true
vsift-application.workspace = true
vsift-contract.workspace = true
vsift-domain.workspace = true
vsift-infrastructure.workspace = true

[dev-dependencies]
jsonschema.workspace = true
serde_json.workspace = true
# Already workspace dependencies; the managed-lookup test (engine_managed_lookup)
# publishes small fixture versions into a test managed root with them.
sha2.workspace = true
tar.workspace = true
# The worker request kill test (engine_worker) stops its child at the
# request fault points, and a workspace test run builds the infrastructure
# crate's P13 transaction tests with the loopback publisher route
# (install-test-hooks); development builds only, never a release.
vsift-infrastructure = { workspace = true, features = ["fault-injection", "install-test-hooks"] }

[lints]
workspace = true
