[package]
name = "vsift"
description = "Embeddable VSift engine: the one library API every VSift host uses"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true

[dependencies]
# Already a dependency of every layer below; the engine uses it directly for
# the per-request tasks and the event channel of a worker batch (P11 PR 4).
tokio.workspace = true
vsift-application.workspace = true
vsift-contract.workspace = true
vsift-domain.workspace = true
vsift-infrastructure.workspace = true

[dev-dependencies]
jsonschema.workspace = true
serde_json.workspace = true
# The worker request kill test (engine_worker) stops its child at the
# request fault points; development builds only, never a release.
vsift-infrastructure = { workspace = true, features = ["fault-injection"] }

[lints]
workspace = true
