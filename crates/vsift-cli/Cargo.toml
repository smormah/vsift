[package]
name = "vsift-cli"
description = "Agent-friendly command-line interface for VSift"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true

[[bin]]
name = "vsift"
path = "src/main.rs"
# The executable shares its name with the `vsift` engine library; rustdoc would
# write both to `target/doc/vsift` (cargo issue 6313). The binary is a one-line
# entry point, so only the library is documented.
doc = false

[dependencies]
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
time.workspace = true
tokio.workspace = true
vsift.workspace = true
vsift-contract.workspace = true

[dev-dependencies]
assert_cmd.workspace = true
getrandom.workspace = true
jsonschema.workspace = true
predicates.workspace = true
# The opt-in P06 checkpoint drives tool verification, and the transcript and
# search contract tests seed session records, through the engine's internal
# crates directly; the CLI itself depends only on `vsift` and `vsift-contract`.
vsift-application.workspace = true
vsift-domain.workspace = true
vsift-infrastructure.workspace = true

[lints]
workspace = true
