[package]
name = "vsift-cli"
description = "Agent-friendly command-line interface for VSift"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true

[[bin]]
name = "vsift"
path = "src/main.rs"
# The executable shares its name with the `vsift` engine library; rustdoc would
# write both to `target/doc/vsift` (cargo issue 6313). The binary is a one-line
# entry point, so only the library is documented.
doc = false

[dependencies]
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
time.workspace = true
tokio.workspace = true
vsift.workspace = true
vsift-contract.workspace = true

[dev-dependencies]
assert_cmd.workspace = true
getrandom.workspace = true
jsonschema.workspace = true
predicates.workspace = true
# Already a workspace development dependency; the O-02 property test of
# `job batch` generates batch files with it.
proptest.workspace = true
# Already workspace dependencies; the P13 plan-after-install test
# (p13_setup_install_cli) publishes stand-in managed versions with them.
sha2.workspace = true
tar.workspace = true
# The opt-in P06 checkpoint drives tool verification, and the transcript and
# search contract tests seed session records, through the engine's internal
# crates directly; the CLI itself depends only on `vsift` and `vsift-contract`.
vsift-application.workspace = true
vsift-domain.workspace = true
vsift-infrastructure.workspace = true

# P14 PR 3: the installed-binary checks start a copy of their own executable as a
# recorder of the environment a tool child inherits, with vsift's own argument
# list, which libtest would reject (see the file's documentation). The target
# prints that it was skipped, and succeeds, unless VSIFT_P14_INSTALLED_E2E=1.
[[test]]
name = "p14_installed_binary_e2e"
harness = false

[lints]
workspace = true
