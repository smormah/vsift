name: Fuzz

# Short libFuzzer passes over the parsers of untrusted input (ADR 0016, decision
# 6). cargo-fuzz needs a nightly toolchain, so by maintainer decision (2026-09-24)
# it runs weekly and on demand rather than on every pull request; the stable
# toolchain and MSRV are unchanged for everything else, and every pull request
# still replays the same target bodies over the committed seeds on stable (CI,
# "Fuzz harness replay"). Long campaigns remain P14 qualification gates.

on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:
    inputs:
      seconds:
        description: Seconds of fuzzing per target (1-1200)
        required: false
        default: "300"

permissions:
  contents: read

concurrency:
  group: fuzz-${{ github.ref }}
  cancel-in-progress: false

env:
  # A dated nightly, not the moving channel, so a scheduled run changes only
  # when this line does. Bump it deliberately (a nightly at least as new as the
  # MSRV in Cargo.toml) and record the date in the pull request.
  FUZZ_TOOLCHAIN: nightly-2026-09-01
  CARGO_FUZZ_VERSION: 0.13.2

jobs:
  fuzz:
    name: Fuzz (${{ matrix.target }})
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        target:
          - transcript_srt
          - transcript_webvtt
          - whisper_full_json
          - transcript_record
          - ffprobe_metadata
          - transcript_cursor
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate the requested duration
        id: duration
        shell: bash
        env:
          REQUESTED: ${{ inputs.seconds || '300' }}
        run: |
          set -euo pipefail
          case "$REQUESTED" in ''|*[!0-9]*) echo "seconds must be a positive integer"; exit 1;; esac
          if [ "$REQUESTED" -lt 1 ] || [ "$REQUESTED" -gt 1200 ]; then
            echo "seconds must be between 1 and 1200"
            exit 1
          fi
          echo "seconds=$REQUESTED" >> "$GITHUB_OUTPUT"

      - name: Install the pinned nightly toolchain
        run: rustup toolchain install "$FUZZ_TOOLCHAIN" --profile minimal

      - name: Install the pinned cargo-fuzz
        run: cargo install cargo-fuzz --version "$CARGO_FUZZ_VERSION" --locked

      - name: Require the committed fuzz lockfile
        run: cargo "+$FUZZ_TOOLCHAIN" metadata --locked --manifest-path fuzz/Cargo.toml --format-version 1 > /dev/null

      - name: Fuzz ${{ matrix.target }}
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          SECONDS_PER_TARGET: ${{ steps.duration.outputs.seconds }}
        run: |
          set -euo pipefail
          mkdir -p "fuzz/corpus/$TARGET"
          cargo "+$FUZZ_TOOLCHAIN" fuzz run --features libfuzzer "$TARGET" \
            "fuzz/corpus/$TARGET" "fuzz/seeds/$TARGET" -- \
            "-max_total_time=$SECONDS_PER_TARGET" -timeout=10 -rss_limit_mb=2048

      - name: Upload the crashing inputs
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fuzz-artifacts-${{ matrix.target }}
          path: fuzz/artifacts/${{ matrix.target }}
          if-no-files-found: ignore
          retention-days: 30
