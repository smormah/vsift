name: P14 scan reading

# P14 PR 4, evidence item RQ-13 (docs/planning/p14-qualification.md section 6,
# R-SEC03): the hosted part of the scan reading, with its output kept as an
# artifact so the written reading (docs/planning/p14-scan-reading-2026-10-02.md)
# can cite a run:
#
#   cargo deny   `cargo deny check` (advisories, licences, bans, sources) for the
#                workspace and for the fuzz crate, with every warning shown
#   binary       the published Linux executable's required glibc version and its
#                shared libraries (the OpenSSL 3 requirement), from the installed
#                npm package
#   inventory    the published release's SBOM (the Rust graph of the Linux
#                target) against what `cargo metadata` resolves for the same
#                target at the tag
#
# The GitHub alerts (CodeQL, Dependabot, secret scanning) and the advisories of
# the pinned actions and the native tools are read with read-only `gh api` calls
# and public pages by the packet owner; they are in the written reading. This
# workflow reads, it never changes a setting or dismisses an alert. It cannot
# publish anything: it has `contents: read` only and uses no secret.
#
# Triggers: a manual dispatch, and a pull request that changes this workflow or
# its tool.
on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/p14-scan-reading.yml
      - tools/p14-campaigns/scan-inventory.cjs
  workflow_dispatch:
    inputs:
      version:
        description: The published version of vsift-cli to inspect. Empty means the version on the next tag.
        type: string
        default: ""

permissions: {}

concurrency:
  group: p14-scan-reading-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

env:
  NODE_VERSION: "22.23.3"
  CARGO_DENY_VERSION: "0.20.2"

jobs:
  read:
    name: Read cargo deny, the binary and the SBOM (Ubuntu 24.04)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up the pinned Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false

      - name: Install the pinned cargo-deny
        run: cargo install cargo-deny --version "$CARGO_DENY_VERSION" --locked

      - name: Run cargo deny for the workspace and for the fuzz crate
        run: |
          set -uo pipefail
          mkdir -p "${RUNNER_TEMP}/scan"
          rc=0
          cargo deny --version | tee "${RUNNER_TEMP}/scan/cargo-deny-version.txt"
          cargo deny check 2>&1 | tee "${RUNNER_TEMP}/scan/deny-workspace.txt" | tail -3 || rc=1
          cargo deny --all-features --manifest-path fuzz/Cargo.toml check 2>&1 | tee "${RUNNER_TEMP}/scan/deny-fuzz.txt" | tail -3 || rc=1
          cargo deny --format json check advisories 2>"${RUNNER_TEMP}/scan/deny-advisories.json" || rc=1
          grep -c '^warning\[' "${RUNNER_TEMP}/scan/deny-workspace.txt" || true
          exit "$rc"

      - name: Install the published package and read the executable
        id: published
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          node tools/p14-campaigns/install-published.cjs \
            --prefix "${RUNNER_TEMP}/published" \
            --version "${VERSION}" \
            --github-output "$GITHUB_OUTPUT" | tee "${RUNNER_TEMP}/scan/published.json"
          binary="${RUNNER_TEMP}/published/node_modules/@vsift/linux-x64/vsift"
          {
            echo "## The published executable"
            echo
            echo "Highest glibc symbol version required:"
            objdump -T "$binary" | grep -o 'GLIBC_[0-9.]*' | sort -Vu | tail -1
            echo
            echo "Needed shared libraries (readelf):"
            readelf -d "$binary" | grep NEEDED | sed 's/.*Shared library: //'
            echo
            echo "OpenSSL symbol versions required:"
            objdump -T "$binary" | grep -o 'OPENSSL_[0-9.]*' | sort -Vu | tail -3
          } | tee "${RUNNER_TEMP}/scan/binary.txt"

      - name: Compare the published SBOM with what cargo metadata resolves
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.published.outputs.version }}
        run: |
          set -euo pipefail
          gh release download "v${VERSION}" --repo "${GITHUB_REPOSITORY}" \
            --pattern "vsift-${VERSION}-x86_64-unknown-linux-gnu.cdx.json" --dir "${RUNNER_TEMP}/scan"
          git fetch --depth 1 origin "refs/tags/v${VERSION}:refs/tags/v${VERSION}" || true
          git checkout --quiet "v${VERSION}" -- Cargo.lock Cargo.toml 2>/dev/null || true
          cargo metadata --locked --filter-platform x86_64-unknown-linux-gnu --format-version 1 > "${RUNNER_TEMP}/scan/metadata.json"
          node tools/p14-campaigns/scan-inventory.cjs \
            --sbom "${RUNNER_TEMP}/scan/vsift-${VERSION}-x86_64-unknown-linux-gnu.cdx.json" \
            --metadata "${RUNNER_TEMP}/scan/metadata.json" | tee "${RUNNER_TEMP}/scan/inventory.json"

      - name: Put the readings in the job summary
        if: always()
        run: |
          {
            echo "## P14 scan reading (RQ-13), hosted part"
            echo
            echo '```'
            cat "${RUNNER_TEMP}/scan/cargo-deny-version.txt" 2>/dev/null || true
            tail -2 "${RUNNER_TEMP}/scan/deny-workspace.txt" 2>/dev/null || true
            tail -2 "${RUNNER_TEMP}/scan/deny-fuzz.txt" 2>/dev/null || true
            echo '```'
            echo
            cat "${RUNNER_TEMP}/scan/binary.txt" 2>/dev/null || true
            echo
            echo '```'
            head -c 1500 "${RUNNER_TEMP}/scan/inventory.json" 2>/dev/null || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Keep the readings
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: p14-scan-reading
          path: ${{ runner.temp }}/scan
          if-no-files-found: warn
          retention-days: 90
