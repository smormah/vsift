name: P13 managed power loss

# The managed store's power-loss qualification (P13 PR 7, ADR 0023 decision
# H9, docs/planning/verification.md "P13 PR 7 evidence"). It reuses layer A
# of the P10 crash campaign (tools/p10-crash-campaign): a fresh ext4
# filesystem on a dm-log-writes device on a disposable hosted Ubuntu 24.04
# runner, the managed workload (install, reinstall, rollback, version and
# component removal, abandoned stages and sweeps on one-file stand-in
# versions), then a replay that rebuilds the device after every flush and
# holds each point to every acknowledged command kept and no damage
# (fail-closed detection plus repair for what a power loss catches half
# done).
#
# The negative control (the campaign build's VSIFT_CAMPAIGN_NEGATIVE_CONTROL=1)
# skips every folder flush and each runtime file's flush: it must lose
# acknowledgements, and still show no damage.
#
# The runner needs root for the loop and device-mapper devices; nothing
# runs on a developer machine. The jobs receive no secrets, download
# nothing but the pinned actions and crates, and send nothing anywhere.

on:
  workflow_dispatch:
    inputs:
      operations:
        description: Managed commands in the positive run
        required: false
        default: "150"

permissions:
  contents: read

concurrency:
  group: p13-managed-power-loss-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: never

jobs:
  build:
    name: Build campaign binaries
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Test the campaign harness
        run: cargo test --locked -p vsift-crash-campaign

      - name: Build the positive and the negative-control binaries
        shell: bash
        run: |
          set -euo pipefail
          cargo build --locked --release -p vsift-crash-campaign
          cargo build --locked --profile campaign --features campaign -p vsift-crash-campaign
          mkdir -p bin
          cp target/release/vsift-crash-campaign bin/positive
          cp target/campaign/vsift-crash-campaign bin/campaign
          echo "commit=$GITHUB_SHA" | tee bin/build.txt
          rustc --version >> bin/build.txt

      - name: Upload binaries
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: managed-campaign-binaries
          path: bin/
          retention-days: 7

  layer-a:
    name: Power loss at every flush (${{ matrix.mode }})
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    strategy:
      fail-fast: false
      matrix:
        mode: [positive, negative]
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download binaries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: managed-campaign-binaries
          path: bin

      - name: Replay every flush of the managed workload
        shell: bash
        env:
          MODE: ${{ matrix.mode }}
          OPERATIONS: ${{ matrix.mode == 'negative' && '60' || inputs.operations || '150' }}
        run: |
          set -euo pipefail
          chmod +x bin/*
          binary=bin/positive
          if [ "$MODE" = negative ]; then binary=bin/campaign; fi
          sudo modprobe dm_log_writes
          sudo tools/p10-crash-campaign/scripts/layer-a.sh "$PWD/$binary" /dev/shm/vsift-managed \
            "$OPERATIONS" 20260930 "$MODE" "$PWD/out" managed
          cat out/result.txt >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: managed-layer-a-${{ matrix.mode }}
          path: out/
          retention-days: 90

  summary:
    name: Acceptance
    needs: [layer-a]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Download the evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: evidence

      - name: Check the acceptance numbers
        shell: bash
        run: |
          set -uo pipefail
          field() { sed -n "s/.* $1=\([0-9]*\).*/\1/p" <<< " $2" | head -n 1; }
          positive=$(cat evidence/managed-layer-a-positive/result.txt 2>/dev/null || true)
          negative=$(cat evidence/managed-layer-a-negative/result.txt 2>/dev/null || true)
          {
            echo "## P13 managed power loss"
            echo
            echo "- Positive: \`${positive:-missing}\`"
            echo "- Negative control: \`${negative:-missing}\`"
          } | tee -a "$GITHUB_STEP_SUMMARY"
          failures=0
          if [ "$(field status "$positive")" != 0 ] || [ "$(field points "$positive")" = "" ] \
            || [ "$(field points "$positive")" -lt 500 ] || [ "$(field lost_acks "$positive")" != 0 ] \
            || [ "$(field damaged_points "$positive")" != 0 ] \
            || [ "$(field fsck_failures "$positive")" != 0 ] || [ "$(field mount_failures "$positive")" != 0 ]; then
            echo "- **FAIL**: the positive run needs >= 500 replay points, no undone acknowledgement, no damage and clean fsck" | tee -a "$GITHUB_STEP_SUMMARY"
            failures=$(( failures + 1 ))
          fi
          if [ "$(field status "$negative")" != 1 ] || [ "$(field lost_acks "$negative")" = "" ] \
            || [ "$(field lost_acks "$negative")" -lt 1 ] || [ "$(field damaged_points "$negative")" != 0 ]; then
            echo "- **FAIL**: the negative control needs lost acknowledgements and no damage" | tee -a "$GITHUB_STEP_SUMMARY"
            failures=$(( failures + 1 ))
          fi
          if [ "$failures" != 0 ]; then exit 1; fi
          echo "**All acceptance criteria met.**" | tee -a "$GITHUB_STEP_SUMMARY"
