name: Release

# Builds and packages VSift's native release archives (P13 PR 8, ADR 0023
# section 1 and decision D) and keeps them only as this run's artifacts:
#
#   guard      first, in seconds, before anything is built (#337, release.md
#              6.18): a dispatch runs only on `main`, the release branch
#              `release/<MAJOR>.<MINOR>.x` of the workspace version or the tag
#              v<version>, and only the tag publishes; a tag must be on that
#              release branch, and a pre-release (a candidate) only from a
#              commit whose latest Nightly run that tested it passed
#              (governance rule 15). Every other job needs it.
#   inventory  THIRD-PARTY-NOTICES (cargo-about) and a CycloneDX SBOM
#              (cargo-cyclonedx) for each target, from the lockfile only.
#   build      the `vsift` executable per target, built twice on the same
#              runner and compared byte for byte; its --version must name the
#              commit it was built from.
#   package    one deterministic vsift-<version>-<target>.tar.gz per target,
#              each read back and checked, packaged twice and compared, and
#              SHA256SUMS over the three archives.
#   npm-package  the four npm packages (the `vsift-cli` launcher and
#              @vsift/{win32-x64,darwin-arm64,linux-x64}) assembled from the
#              archives, packed twice with `npm pack` and compared, and each
#              tarball checked against the assembly (P13 PR 9).
#   npm-qualify  per runner and package manager (npm, pnpm, Yarn, Bun): the
#              tarballs published to a Verdaccio registry on 127.0.0.1 with
#              no uplink, installed and run (npm/qualification/qualify.cjs).
#              Nothing is published to any public registry.
#   plan       on every run: checks the archives, SHA256SUMS and the
#              qualified tarballs again, reads npm's public metadata of the
#              four packages (anonymous GETs), decides whether this run may
#              publish and writes the plan, which the job summary shows (P13
#              PR 10). The version decides the channel (P14 PR 8): with a
#              pre-release suffix it is `prerelease` (dist-tag `next`);
#              without one it is `stable` (dist-tag `latest`), and the plan
#              then also compares this commit with the accepted release
#              candidate and checks the registry before `latest` may move.
#   attest     only when publishing: Sigstore build provenance for every
#              release asset and npm tarball.
#   publish    only when publishing, in the protected `release` environment
#              after the maintainer's approval: the tarballs the npm-qualify
#              jobs installed, by digest, to npm with npm provenance (trusted
#              publishing), platform packages first, then the GitHub release
#              with its assets. Each channel has its own steps with its own
#              dist-tag, written out in full and gated on the plan's `channel`
#              output: `--tag next` and a GitHub pre-release for a
#              pre-release, `--tag latest` and the release marked latest for a
#              stable version.
#
# Every run is a dry run (ADR 0023 section 1: it builds, checks and plans
# everything, and writes nothing outside the run: no attestation, release or
# package) except a manual dispatch on the tag v<version> of smormah/vsift with
# `dry_run` cleared. Candidate and stable tags are made on the release branch
# (ADR 0024, note of 2026-10-17), which takes window fixes by pull request
# while `main` keeps taking merges. Pull requests, pushes and forks never
# publish: the guard, the privileged jobs' conditions and the plan all refuse
# them, and the lint in
# tools/vsift-governance (workflows/publish.rs) holds this file to those rules.
# The workflow never runs `npm dist-tag`: `latest` moves only by publishing a
# stable version with `--tag latest`. The runbook is docs/operations/release.md
# section 6.
#
# Release builds take no features, so no development-only feature, test
# binary or profile override can reach an archive; the governance workflow
# lint (tools/vsift-governance, workflows.rs) enforces that for this file.
#
# The pull-request and push triggers name every path whose change can alter an
# archive or an npm package: the crates compiled into `vsift`, the skill, the
# licences, the toolchain and lockfile, the packaging tool, the launcher and
# its qualification (npm/, and the console-event helper it uses on Windows)
# and this workflow. A change elsewhere (documentation, the fixture corpus,
# other tools) cannot. A pull request to a release branch, and a push to one,
# runs the same dry run as one to `main`.
on:
  pull_request:
    branches:
      - main
      - release/**
    paths:
      - .github/workflows/release.yml
      - crates/**
      - tools/vsift-release/**
      - tools/send-console-ctrl.ps1
      - npm/**
      - skills/vsift/**
      - Cargo.toml
      - Cargo.lock
      - rust-toolchain.toml
      - LICENSE
      - LICENSE-APACHE
      - LICENSE-MIT
  push:
    branches:
      - main
      - release/**
    paths:
      - .github/workflows/release.yml
      - crates/**
      - tools/vsift-release/**
      - tools/send-console-ctrl.ps1
      - npm/**
      - skills/vsift/**
      - Cargo.toml
      - Cargo.lock
      - rust-toolchain.toml
      - LICENSE
      - LICENSE-APACHE
      - LICENSE-MIT
  # A dispatch is a dry run unless `dry_run` is cleared, and a cleared
  # `dry_run` publishes only on the tag v<version> (the guard job refuses any
  # other ref in seconds, and the plan job again). No tag push or release
  # event starts this workflow: the maintainer creates the tag under the tag
  # ruleset, then dispatches it.
  workflow_dispatch:
    inputs:
      dry_run:
        description: Dry run (build, check and show the plan; publish nothing). Choose the tag v<version> in "Use workflow from" (not main) and clear it only there to publish, after the release environment's approval.
        type: boolean
        default: true

permissions: {}

# A publishing run is never cancelled by a newer run on the same ref; pull
# requests and pushes still cancel their superseded runs.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

defaults:
  run:
    shell: bash

env:
  CARGO_TERM_COLOR: never
  # The pinned inventory tools (reviewed 2026-09-30): cargo-about 0.9.2 and
  # cargo-cyclonedx 0.5.9, both built from crates.io with their own lockfiles.
  CARGO_ABOUT_VERSION: "=0.9.2"
  CARGO_CYCLONEDX_VERSION: "=0.5.9"
  # The npm qualification's pinned tools (P13 PR 9, reviewed 2026-09-30):
  # the minimum runtimes ADR 0023 decision H6 supports (Node.js 22, Bun 1.2),
  # the current pnpm and Yarn, and the local registry.
  NODE_VERSION: "22.23.4"
  # The publish job's Node.js (P13 PR 10, reviewed 2026-10-01): npm trusted
  # publishing needs npm 11.5.1 or later, and Node.js 22 ships npm 10;
  # Node.js 24.22.1 ships npm 11.19.1.
  PUBLISH_NODE_VERSION: "24.22.1"
  BUN_VERSION: "1.2.23"
  PNPM_VERSION: "12.8.1"
  YARN_VERSION: "4.18.1"
  VERDACCIO_VERSION: "6.10.4"

jobs:
  # The first job and the only one without `needs`, so a dispatch on the wrong
  # ref, or a candidate from a commit the nightly has not passed, is refused in
  # seconds rather than after the thirteen build and qualification jobs (#337).
  # It reads the workspace manifest and GitHub's records of this repository,
  # and nothing else: no build, no secret, no write scope. The plan job's own
  # check of the ref stays (defence in depth).
  #
  # Which refs may run each mode (release.md 6.18):
  #   dry run (dispatch, dry_run set)  main; release/<MAJOR>.<MINOR>.x of the
  #                                    workspace version; the tag v<version>
  #   publish (dry_run cleared)        the tag v<version> only, in smormah/vsift
  # On the tag, the dry run is the rehearsal of the publish and is held to the
  # same rules: the tag must still name the commit this run built (an
  # annotated tag peeled; a re-run of an old run after the tag moved is
  # refused), that commit must be on the release branch (compared with the
  # branch head's own commit, so a tag of the branch's name cannot stand in),
  # the rulesets that apply to the branch must hold the five rule types of
  # release.md 6.2 step 8, and for a pre-release (a candidate) the latest
  # Nightly run that tested exactly that commit must have passed, with no run
  # of it still in progress. A stable version is not asked for a nightly of
  # its own: its code is its accepted candidate's, which the plan compares
  # (6.8). The publish job asks all of it again after the approval.
  #
  # Why exactly that commit (governance rule 15): a pass of a later commit
  # does not show that this one passes, because the later commit may hold the
  # very fix of this one's failure (the stop-the-line fix is such a commit),
  # and a commit of a release branch is never an ancestor of `main` when
  # pull requests are squashed. Only a run whose head is the commit tested the
  # bytes the candidate is built from. The latest such run decides, so a pass
  # followed by a failed re-run is refused. A scheduled run that found nothing
  # new on `main` concludes `success` having run nothing, so a run in which
  # only one job ran is passed over, not counted; only `schedule` and
  # `workflow_dispatch` runs count; and every job of the deciding run but
  # `Report a failure` must have concluded `success` (a skipped check is not a
  # passed one). A commit no nightly tested gets one by dispatch (`gh workflow
  # run nightly.yml --ref <branch>`).
  guard:
    name: Ref and nightly guard
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    steps:
      - name: Check out the workspace manifest
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: /Cargo.toml
          sparse-checkout-cone-mode: false

      - name: Refuse a wrong ref, or a candidate without a passed nightly, before anything is built
        env:
          EVENT_NAME: ${{ github.event_name }}
          GIT_REF: ${{ github.ref }}
          REPOSITORY: ${{ github.repository }}
          DRY_RUN_INPUT: ${{ github.event.inputs.dry_run }}
          SOURCE_COMMIT: ${{ github.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          refuse() {
            echo "Refused before anything is built: $*" >&2
            printf '## Release: refused before anything is built\n\n%s\n' "$*" >> "${GITHUB_STEP_SUMMARY}"
            exit 1
          }
          note() {
            echo "$*"
            printf '%s\n\n' "$*" >> "${GITHUB_STEP_SUMMARY}"
          }
          # nightly_passed: whether the latest Nightly run that tested exactly
          # SOURCE_COMMIT passed, with no run of it still in progress (the rules are
          # in the guard job's comment); sets `verdict` either way.
          nightly_passed() {
            local runs_filter jobs_filter runs started id status conclusion jobs ran failing
            runs_filter='.workflow_runs[] | select(.event == "schedule" or .event == "workflow_dispatch") | "\(.run_started_at) \(.id) \(.status) \(.conclusion)"'
            jobs_filter='.jobs[] | "\(.conclusion // "unfinished")\t\(.name)"'
            runs="$(gh api "repos/smormah/vsift/actions/workflows/nightly.yml/runs?head_sha=${SOURCE_COMMIT}&per_page=100" --jq "${runs_filter}")" || {
              verdict="the Nightly runs of ${SOURCE_COMMIT} could not be read"
              return 1
            }
            while read -r started id status conclusion; do
              if [ -n "${id}" ] && [ "${status}" != completed ]; then
                verdict="Nightly run ${id} of ${SOURCE_COMMIT} is still ${status}: wait for it to finish, then dispatch again"
                return 1
              fi
            done <<< "${runs}"
            while read -r started id status conclusion; do
              [ -n "${id}" ] || continue
              jobs="$(gh api "repos/smormah/vsift/actions/runs/${id}/jobs?per_page=100" --jq "${jobs_filter}")" || {
                verdict="the jobs of Nightly run ${id} could not be read"
                return 1
              }
              ran="$(printf '%s\n' "${jobs}" | awk -F '\t' '$2 != "" && $1 != "skipped" { n++ } END { print n + 0 }')"
              if [ "${ran}" -le 1 ]; then
                echo "Nightly run ${id} (${started}) ran no check (nothing new on main that night): passed over"
                continue
              fi
              failing="$(printf '%s\n' "${jobs}" | awk -F '\t' '$2 != "" && $2 != "Report a failure" && $1 != "success" { list = list sep $2 " (" $1 ")"; sep = ", " } END { print list }')"
              if [ "${conclusion}" = success ] && [ -z "${failing}" ]; then
                verdict="Nightly run ${id} (${started}) passed on ${SOURCE_COMMIT}"
                return 0
              fi
              verdict="the latest Nightly run that tested ${SOURCE_COMMIT}, run ${id} (${started}), concluded ${conclusion}${failing:+, with ${failing}}"
              return 1
            done < <(printf '%s\n' "${runs}" | sort -r)
            verdict="no Nightly run has tested ${SOURCE_COMMIT}"
            return 1
          }
          # on_release_branch: whether SOURCE_COMMIT is on the release branch, read
          # by the branch head's own commit (a tag of the same name cannot stand in
          # for the branch); sets `verdict` when it is not. On an error gh prints
          # GitHub's error body, not the filter's answer: only the exit status counts.
          on_release_branch() {
            local head status
            head="$(gh api "repos/smormah/vsift/git/ref/heads/${release_branch}" --jq .object.sha)" || head=""
            if ! [[ "${head}" =~ ^[0-9a-f]{40}$ ]]; then
              verdict="${release_branch} does not exist or could not be read"
              return 1
            fi
            status="$(gh api "repos/smormah/vsift/compare/${SOURCE_COMMIT}...${head}?per_page=1" --jq .status)" || status=""
            case "${status}" in
              identical | ahead) return 0 ;;
              "") verdict="the comparison of ${SOURCE_COMMIT} with ${release_branch} (${head}) could not be read" ;;
              *) verdict="${SOURCE_COMMIT} is not on ${release_branch} (GitHub's comparison with its head ${head} says '${status}')" ;;
            esac
            return 1
          }
          # tag_commit: the commit the tag names now, an annotated tag peeled, in
          # `tagged`; empty when GitHub cannot say. A tag moved after the dispatch
          # must not get this run's build.
          tag_commit() {
            local ref_filter answer type sha
            ref_filter='"\(.object.type) \(.object.sha)"'
            tagged=""
            answer="$(gh api "repos/smormah/vsift/git/ref/tags/${tag}" --jq "${ref_filter}")" || answer=""
            for _ in 1 2 3 4; do
              read -r type sha <<< "${answer}"
              [[ "${sha}" =~ ^[0-9a-f]{40}$ ]] || return 1
              case "${type}" in
                commit)
                  tagged="${sha}"
                  return 0
                  ;;
                tag) answer="$(gh api "repos/smormah/vsift/git/tags/${sha}" --jq "${ref_filter}")" || answer="" ;;
                *) return 1 ;;
              esac
            done
            return 1
          }
          # release_branch_protected: whether the rulesets that apply to the release
          # branch hold the five rule types of release.md 6.2 step 8; sets `verdict`
          # when they do not.
          release_branch_protected() {
            local rules rule missing
            rules="$(gh api "repos/smormah/vsift/rules/branches/${release_branch}?per_page=100" --jq '.[].type')" || {
              verdict="the rules of ${release_branch} could not be read"
              return 1
            }
            missing=""
            for rule in creation deletion non_fast_forward pull_request required_status_checks; do
              printf '%s\n' "${rules}" | grep -qx "${rule}" || missing="${missing:+${missing}, }${rule}"
            done
            [ -n "${missing}" ] || return 0
            verdict="the rulesets of ${release_branch} have no ${missing} rule (release.md 6.2 step 8)"
            return 1
          }

          if [ "${EVENT_NAME}" != workflow_dispatch ]; then
            note "A ${EVENT_NAME} run is a dry run of its own branch; the ref and nightly rules apply to a dispatch."
            exit 0
          fi
          version="$(awk '$0 == "[workspace.package]" { section = 1; next } /^\[/ { section = 0 } section && $1 == "version" && $2 == "=" { gsub(/"/, "", $3); print $3; exit }' Cargo.toml)"
          [[ "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] || refuse "the workspace version in Cargo.toml could not be read ('${version}')"
          core="${version%%-*}"
          release_branch="release/${core%.*}.x"
          tag="v${version}"
          case "${DRY_RUN_INPUT}" in
            true) mode="dry run" ;;
            false) mode=publish ;;
            *) refuse "the dry_run input '${DRY_RUN_INPUT}' is neither true nor false" ;;
          esac
          case "${GIT_REF}" in
            "refs/tags/${tag}") ;;
            refs/heads/main | "refs/heads/${release_branch}")
              if [ "${mode}" = publish ]; then
                refuse "a publish is dispatched on the tag ${tag} (\"Use workflow from\": Tags), never on a branch; this run is on ${GIT_REF}. Dispatch it on the tag, or leave dry_run set"
              fi
              if [ "${GIT_REF}" = "refs/heads/${release_branch}" ] && [ "${REPOSITORY}" = smormah/vsift ] && [[ "${version}" == *-* ]]; then
                if nightly_passed; then
                  note "A dry run on ${release_branch}. A candidate tagged on this commit would meet the nightly precondition: ${verdict}."
                else
                  note "A dry run on ${release_branch}. **A candidate tagged on this commit would be refused:** ${verdict}."
                fi
              else
                note "A dry run on ${GIT_REF#refs/heads/}: it builds, checks and plans, and publishes nothing."
              fi
              exit 0
              ;;
            *)
              refuse "the Release workflow is dispatched as a dry run only on main, ${release_branch} or the tag ${tag}, and publishes only on the tag ${tag}; this run is on ${GIT_REF}"
              ;;
          esac
          [ "${REPOSITORY}" = smormah/vsift ] || refuse "a release tag is dispatched only in smormah/vsift, not in ${REPOSITORY}"
          tag_commit || tagged=""
          [ "${tagged}" = "${SOURCE_COMMIT}" ] || refuse "the tag ${tag} names ${tagged:-nothing GitHub could read} now, not ${SOURCE_COMMIT}, the commit this run built (a re-run of a run from before the tag moved): dispatch the tag again"
          on_release_branch || refuse "the tag ${tag} must be on ${release_branch}, where candidates and stable releases are made: ${verdict}"
          release_branch_protected || refuse "a release is made only on a protected release branch: ${verdict}"
          if [[ "${version}" == *-* ]]; then
            nightly_passed || refuse "a release candidate is made only from a commit whose latest Nightly run passed (governance rule 15): ${verdict}. Run it on that commit with: gh workflow run nightly.yml --repo smormah/vsift --ref ${release_branch} (when the branch's head is the commit), and dispatch again when it has passed"
            note "The nightly precondition holds: ${verdict}."
          else
            note "A stable version: its code is its accepted candidate's, which met the nightly precondition when it was made; the plan compares the two (release.md 6.8)."
          fi
          note "The ${mode} of ${tag} (on ${release_branch}) goes on to the build."

  inventory:
    name: Notices and SBOMs
    needs:
      - guard
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Record the source commit's time
        run: echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)" >> "$GITHUB_ENV"

      - name: Install the pinned inventory tools
        run: |
          set -euo pipefail
          cargo install --locked --version "${CARGO_ABOUT_VERSION}" --features cli cargo-about
          cargo install --locked --version "${CARGO_CYCLONEDX_VERSION}" cargo-cyclonedx

      - name: Fetch the locked dependency sources
        run: cargo fetch --locked

      - name: Generate the notices and the SBOM of each target
        run: |
          set -euo pipefail
          for target in x86_64-pc-windows-msvc aarch64-apple-darwin x86_64-unknown-linux-gnu; do
            mkdir -p "inventory/${target}"
            cargo about generate --offline --locked --fail --target "${target}" \
              --config tools/vsift-release/notices/about.toml \
              --manifest-path crates/vsift-cli/Cargo.toml \
              --output-file "inventory/${target}/THIRD-PARTY-NOTICES" \
              tools/vsift-release/notices/notices.hbs
            cargo cyclonedx --manifest-path crates/vsift-cli/Cargo.toml --format json \
              --spec-version 1.5 --target "${target}" --override-filename "vsift-${target}.cdx"
            mv "crates/vsift-cli/vsift-${target}.cdx.json" "inventory/${target}/vsift.cdx.json"
          done
          ls -l inventory/*

      - name: Keep the inventory for packaging
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: inventory
          path: inventory
          if-no-files-found: error
          retention-days: 7

  build:
    name: Build (${{ matrix.target }})
    needs:
      - guard
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows 11 x64: MSVC with a static C runtime; /Brepro makes the
          # linker derive the PE timestamp and PDB identity from the content,
          # so two builds of one commit are identical.
          - target: x86_64-pc-windows-msvc
            runner: windows-2025
            executable: vsift.exe
            rustflags: -C target-feature=+crt-static -C link-arg=/Brepro
          # macOS 15 on Apple silicon.
          - target: aarch64-apple-darwin
            runner: macos-15
            executable: vsift
            rustflags: ""
          # x64 glibc Linux built on Ubuntu 22.04, so the binary also runs on
          # newer glibc (ADR 0023 decision D).
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-22.04
            executable: vsift
            rustflags: ""
    env:
      TARGET: ${{ matrix.target }}
      EXECUTABLE: ${{ matrix.executable }}
      RUSTFLAGS: ${{ matrix.rustflags }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Record the source commit
        run: |
          set -euo pipefail
          echo "VSIFT_SOURCE_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          rustup show active-toolchain
          uname -a

      - name: Build vsift (first build)
        run: cargo build --release --locked -p vsift-cli --bin vsift --target "${TARGET}"

      - name: Keep the first build and remove every release output
        run: |
          set -euo pipefail
          mkdir -p reproducibility
          cp "target/${TARGET}/release/${EXECUTABLE}" "reproducibility/${EXECUTABLE}"
          cargo clean --release --target "${TARGET}"

      - name: Build vsift again from scratch
        run: cargo build --release --locked -p vsift-cli --bin vsift --target "${TARGET}"

      - name: Require the two builds to be identical
        run: |
          set -euo pipefail
          sha256sum "reproducibility/${EXECUTABLE}" "target/${TARGET}/release/${EXECUTABLE}"
          cmp "reproducibility/${EXECUTABLE}" "target/${TARGET}/release/${EXECUTABLE}"

      - name: Require the version line to name the source commit
        run: |
          set -euo pipefail
          package_id="$(cargo pkgid -p vsift-cli)"
          version="${package_id##*[#@]}"
          expected="vsift ${version} (${VSIFT_SOURCE_COMMIT:0:12})"
          actual="$("target/${TARGET}/release/${EXECUTABLE}" --version | tr -d '\r')"
          echo "${actual}"
          test "${actual}" = "${expected}"

      - name: Record the executable's runtime dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          ldd --version | head -n 1
          readelf --dynamic "target/${TARGET}/release/${EXECUTABLE}" | grep NEEDED
          objdump -T "target/${TARGET}/release/${EXECUTABLE}" \
            | grep -o 'GLIBC_[0-9.]*' | sort -u -V | tail -n 1

      - name: Record the executable's runtime dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          sw_vers
          otool -L "target/${TARGET}/release/${EXECUTABLE}"

      - name: Require the static C runtime (Windows)
        if: runner.os == 'Windows'
        run: |
          set -euo pipefail
          if grep -a -i -q -E 'vcruntime140(_1)?\.dll|api-ms-win-crt-' "target/${TARGET}/release/${EXECUTABLE}"; then
            echo "vsift.exe imports the dynamic C runtime" >&2
            exit 1
          fi

      - name: Keep the executable for packaging
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: executable-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/${{ matrix.executable }}
          if-no-files-found: error
          retention-days: 7

  package:
    name: Package, verify and checksum
    needs:
      - inventory
      - build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    # SHA256SUMS as a job output: the privileged jobs compare the archives
    # they download with this list, which no later job can change.
    outputs:
      archive-sums: ${{ steps.sums.outputs.sums }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Record the source commit's time
        run: echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)" >> "$GITHUB_ENV"

      - name: Fetch the notices and SBOMs
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: inventory
          path: inventory

      - name: Fetch the executables
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: executable-*
          path: executables

      - name: Package every target twice and check each archive
        run: |
          set -euo pipefail
          release_tool() {
            cargo run --quiet --locked -p vsift-release -- "$@"
          }
          mkdir -p dist second
          for target in x86_64-pc-windows-msvc aarch64-apple-darwin x86_64-unknown-linux-gnu; do
            executable=vsift
            if [ "${target}" = x86_64-pc-windows-msvc ]; then
              executable=vsift.exe
            fi
            inputs=(
              --target "${target}"
              --binary "executables/executable-${target}/${executable}"
              --notices "inventory/${target}/THIRD-PARTY-NOTICES"
              --sbom "inventory/${target}/vsift.cdx.json"
            )
            archive="$(release_tool package "${inputs[@]}" \
              --source-date-epoch "${SOURCE_DATE_EPOCH}" --out-dir dist)"
            release_tool package "${inputs[@]}" \
              --source-date-epoch "${SOURCE_DATE_EPOCH}" --out-dir second
            cmp "${archive}" "second/$(basename "${archive}")"
            release_tool verify "${inputs[@]}" \
              --source-date-epoch "${SOURCE_DATE_EPOCH}" --archive "${archive}"
            tar -tzvf "${archive}"
          done

      - name: Write and check SHA256SUMS
        id: sums
        run: |
          set -euo pipefail
          cargo run --quiet --locked -p vsift-release -- checksums --output dist/SHA256SUMS dist/*.tar.gz
          cat dist/SHA256SUMS
          (cd dist && sha256sum --check --strict SHA256SUMS)
          {
            echo 'sums<<END_OF_SUMS'
            cat dist/SHA256SUMS
            echo 'END_OF_SUMS'
          } >> "$GITHUB_OUTPUT"

      - name: Keep the dry-run archives with this run
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-dry-run
          path: dist
          if-no-files-found: error
          retention-days: 7

  npm-package:
    name: npm packages
    needs:
      - package
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    # The tarballs' digests as a job output: every npm-qualify job, the plan
    # and the privileged jobs require the tarballs they download to be
    # exactly these, so the packages published are the packages qualified.
    outputs:
      tarball-sums: ${{ steps.tarballs.outputs.sums }}
    env:
      npm_config_update_notifier: "false"
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up the pinned Node.js (npm packs the tarballs)
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false

      - name: Fetch the archives
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-dry-run
          path: dist

      - name: Assemble, pack twice and verify the npm packages
        id: tarballs
        run: |
          set -euo pipefail
          archives=()
          for archive in dist/*.tar.gz; do
            archives+=(--archive "${archive}")
          done
          mkdir -p npm-dist/packages npm-dist/tarballs npm-dist/second
          cargo run --quiet --locked -p vsift-release -- npm "${archives[@]}" --out-dir npm-dist/packages
          for package in vsift-cli vsift-darwin-arm64 vsift-linux-x64 vsift-win32-x64; do
            (cd "npm-dist/packages/${package}" && npm pack --ignore-scripts --pack-destination ../../tarballs \
              && npm pack --ignore-scripts --pack-destination ../../second)
          done
          tarballs=()
          for tarball in npm-dist/tarballs/*.tgz; do
            cmp "${tarball}" "npm-dist/second/$(basename "${tarball}")"
            tarballs+=(--tarball "${tarball}")
            tar -tzvf "${tarball}"
          done
          cargo run --quiet --locked -p vsift-release -- npm-verify "${archives[@]}" "${tarballs[@]}"
          cargo run --quiet --locked -p vsift-release -- checksums --output npm-dist/TARBALL-SHA256SUMS npm-dist/tarballs/*.tgz
          cat npm-dist/TARBALL-SHA256SUMS
          {
            echo 'sums<<END_OF_SUMS'
            cat npm-dist/TARBALL-SHA256SUMS
            echo 'END_OF_SUMS'
          } >> "$GITHUB_OUTPUT"

      - name: Keep the npm tarballs with this run
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: npm-packages
          path: npm-dist/tarballs
          if-no-files-found: error
          retention-days: 7

  npm-qualify:
    name: npm qualification (${{ matrix.os }}, ${{ matrix.manager }})
    needs:
      - npm-package
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-2025
          - macos-15
          - ubuntu-24.04
        manager:
          - npm
          - pnpm
          - yarn
          - bun
    env:
      MANAGER: ${{ matrix.manager }}
      npm_config_update_notifier: "false"
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up the pinned Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false

      - name: Set up the pinned Bun
        if: matrix.manager == 'bun'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
          no-cache: true

      # From the public registry, read-only and without credentials: the
      # runner holds no npm token. Verdaccio's own dependencies install with
      # scripts disabled; pnpm needs its install script to link its executable.
      # The package manager goes into a prefix of its own, ahead of any copy
      # the runner image carries (Windows images ship Yarn 1 in npm's prefix).
      - name: Install the pinned registry and package manager
        run: |
          set -euo pipefail
          npm install --prefix "${RUNNER_TEMP}/tools" --ignore-scripts --no-audit --no-fund "verdaccio@${VERDACCIO_VERSION}"
          case "${MANAGER}" in
            pnpm) npm install --prefix "${RUNNER_TEMP}/manager" --no-audit --no-fund "pnpm@${PNPM_VERSION}" ;;
            yarn) npm install --prefix "${RUNNER_TEMP}/manager" --ignore-scripts --no-audit --no-fund "@yarnpkg/cli-dist@${YARN_VERSION}" ;;
          esac
          if [ -d "${RUNNER_TEMP}/manager/node_modules/.bin" ]; then
            echo "${RUNNER_TEMP}/manager/node_modules/.bin" >> "$GITHUB_PATH"
          fi

      - name: Fetch the npm tarballs
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: npm-packages
          path: ${{ runner.temp }}/npm-packages

      # The tarballs qualified here are the ones the publish job publishes:
      # both require them to be exactly npm-package's list, by SHA-256.
      # macOS may lack coreutils' sha256sum; Perl's shasum reads the same list.
      - name: Require the tarballs to be the packed ones
        env:
          TARBALL_SUMS: ${{ needs.npm-package.outputs.tarball-sums }}
        run: |
          set -euo pipefail
          printf '%s\n' "${TARBALL_SUMS}" > "${RUNNER_TEMP}/tarball-sums"
          cd "${RUNNER_TEMP}/npm-packages"
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum --check --strict "${RUNNER_TEMP}/tarball-sums"
          else
            shasum -a 256 --check --strict "${RUNNER_TEMP}/tarball-sums"
          fi
          test "$(ls -A | wc -l)" -eq "$(wc -l < "${RUNNER_TEMP}/tarball-sums")"

      - name: Qualify the packages from a loopback registry
        run: |
          set -euo pipefail
          # The launcher manifest's version, which the release tool holds to
          # the workspace version; the build job's line names the commit.
          version="$(node -p "require('./npm/vsift-cli/package.json').version")"
          commit="$(git rev-parse HEAD)"
          node npm/qualification/qualify.cjs \
            --manager "${MANAGER}" \
            --packages "${RUNNER_TEMP}/npm-packages" \
            --verdaccio "${RUNNER_TEMP}/tools/node_modules/verdaccio/bin/verdaccio" \
            --version-line "vsift ${version} (${commit:0:12})" \
            --work "${RUNNER_TEMP}/qualification"

  # Runs on every run and has no write scope, OIDC token or secret. It checks
  # the inputs once more, decides the mode and shows the plan in the job
  # summary; a dry run ends here, so this is what a dry run shows.
  plan:
    name: Publish plan (a dry run publishes nothing)
    needs:
      - package
      - npm-package
      - npm-qualify
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      mode: ${{ steps.plan.outputs.mode }}
      version: ${{ steps.plan.outputs.version }}
      tag: ${{ steps.plan.outputs.tag }}
      channel: ${{ steps.plan.outputs.channel }}
      # The four packages' dist-tags as the plan read them, before anything
      # was published (`<package> <latest> <next>`, `none` for a tag that is
      # not set, `unknown` for what could not be read). The publish job takes
      # its "before" from here: a re-run of failed jobs keeps this output, so a
      # stale read after a partial publish cannot pass for the old value.
      tags-before: ${{ steps.plan.outputs.tags-before }}
      plan-sums: ${{ steps.plan-sums.outputs.sums }}
    steps:
      # The full history and every tag: a stable version's plan compares this
      # commit with its accepted release candidate (`vsift-release
      # publish-plan`, candidate.rs), which needs the candidate's tag and
      # commit in the clone.
      - name: Check out repository (full history and tags)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Fetch the archives
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-dry-run
          path: dist

      - name: Fetch the npm tarballs
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: npm-packages
          path: npm-packages

      - name: Require the archives and tarballs to be the checked and qualified ones
        env:
          ARCHIVE_SUMS: ${{ needs.package.outputs.archive-sums }}
          TARBALL_SUMS: ${{ needs.npm-package.outputs.tarball-sums }}
        run: |
          set -euo pipefail
          printf '%s\n' "${ARCHIVE_SUMS}" | cmp - dist/SHA256SUMS
          (cd dist && sha256sum --check --strict SHA256SUMS)
          test "$(ls -A dist | wc -l)" -eq 4
          printf '%s\n' "${TARBALL_SUMS}" > "${RUNNER_TEMP}/tarball-sums"
          (cd npm-packages && sha256sum --check --strict "${RUNNER_TEMP}/tarball-sums")
          test "$(ls -A npm-packages | wc -l)" -eq "$(wc -l < "${RUNNER_TEMP}/tarball-sums")"

      # Anonymous, read-only GETs of the four packages' public metadata, kept
      # in the runner's temporary folder with each answer's HTTP status (a 404
      # is "no such package", anything else that is not 200 is "unreadable").
      # `publish-plan` takes from them only the dist-tags and each version's
      # integrity: the metadata names the package's maintainers, so it is
      # never printed or uploaded. A pre-release plan shows what it finds; a
      # stable plan refuses to go on without it.
      - name: Read npm's public metadata of the four packages
        run: |
          set -euo pipefail
          mkdir "${RUNNER_TEMP}/registry"
          for package in @vsift/darwin-arm64 @vsift/win32-x64 @vsift/linux-x64 vsift-cli; do
            stem="${package#@}"
            stem="${stem//\//-}"
            status="$(curl --silent --show-error --proto '=https' --max-time 60 --retry 3 --output "${RUNNER_TEMP}/registry/${stem}.json" --write-out '%{http_code}' "https://registry.npmjs.org/${package//\//%2F}" || true)"
            printf '%s\n' "${status:-000}" > "${RUNNER_TEMP}/registry/${stem}.status"
            echo "${package}: HTTP ${status:-000}"
          done

      # The accepted release candidate of a stable version (the highest
      # v<X.Y.Z>-rc.<N> tag, found by the code the plan itself uses): its
      # version and commit, or nothing for any other version or when there is
      # no candidate. The evidence step below runs only when they are there.
      - name: Find the accepted release candidate
        id: candidate
        env:
          SOURCE_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          cargo run --quiet --locked -p vsift-release -- candidate-delta --github-output --stable-commit "${SOURCE_COMMIT}" >> "$GITHUB_OUTPUT"

      # RQ-20: the evidence ledger must be complete for that candidate. The
      # governance tool's exit status and output are kept, not acted on here:
      # `publish-plan` reads them and refuses a stable plan wherever it is
      # enforced, and shows the findings wherever it only reports.
      - name: Check the evidence ledger for the accepted candidate
        if: steps.candidate.outputs.candidate-version != ''
        env:
          CANDIDATE_VERSION: ${{ steps.candidate.outputs.candidate-version }}
          CANDIDATE_COMMIT: ${{ steps.candidate.outputs.candidate-commit }}
        run: |
          set -euo pipefail
          mkdir "${RUNNER_TEMP}/evidence"
          status=0
          cargo run --quiet --locked -p vsift-governance -- release-evidence --complete-for "${CANDIDATE_VERSION}" --commit "${CANDIDATE_COMMIT}" > "${RUNNER_TEMP}/evidence/result.txt" 2>&1 || status=$?
          echo "${status}" > "${RUNNER_TEMP}/evidence/status"
          cat "${RUNNER_TEMP}/evidence/result.txt"

      # A refused plan still writes its explanation, so the summary shows why
      # the run stops; the step then fails.
      - name: Plan the release
        id: plan
        env:
          EVENT_NAME: ${{ github.event_name }}
          GIT_REF: ${{ github.ref }}
          REPOSITORY: ${{ github.repository }}
          DRY_RUN_INPUT: ${{ github.event.inputs.dry_run }}
          SOURCE_COMMIT: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          archives=()
          for archive in dist/*.tar.gz; do
            archives+=(--archive "${archive}")
          done
          tarballs=()
          for tarball in npm-packages/*.tgz; do
            tarballs+=(--tarball "${tarball}")
          done
          mkdir publish-plan
          status=0
          cargo run --quiet --locked -p vsift-release -- publish-plan "${archives[@]}" \
            --checksums dist/SHA256SUMS "${tarballs[@]}" --event "${EVENT_NAME}" --ref "${GIT_REF}" \
            --repository "${REPOSITORY}" --dry-run-input "${DRY_RUN_INPUT}" --commit "${SOURCE_COMMIT}" \
            --registry "${RUNNER_TEMP}/registry" --evidence "${RUNNER_TEMP}/evidence" \
            --run-id "${RUN_ID}" --date "$(date -u +%F)" \
            --out-dir publish-plan > "${RUNNER_TEMP}/plan-outputs" || status=$?
          if [ -f publish-plan/publish-plan.md ]; then
            cat publish-plan/publish-plan.md >> "$GITHUB_STEP_SUMMARY"
            cat publish-plan/publish-plan.md
          fi
          test "${status}" -eq 0
          cat "${RUNNER_TEMP}/plan-outputs" >> "$GITHUB_OUTPUT"

      - name: Record the plan's digests
        id: plan-sums
        run: |
          set -euo pipefail
          {
            echo 'sums<<END_OF_SUMS'
            (cd publish-plan && sha256sum -- *)
            echo 'END_OF_SUMS'
          } >> "$GITHUB_OUTPUT"

      - name: Keep the plan with this run
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: publish-plan
          path: publish-plan
          if-no-files-found: error
          retention-days: 7

  # Only when publishing: a manual dispatch with dry_run cleared, on a v* tag
  # of smormah/vsift, which the plan has accepted as this version's tag. It
  # runs no repository code; it checks what it downloaded against the earlier
  # jobs' outputs and attests exactly the plan's list.
  attest:
    name: Attest build provenance
    needs:
      - package
      - npm-package
      - npm-qualify
      - plan
    if: >-
      github.event_name == 'workflow_dispatch'
      && github.event.inputs.dry_run == 'false'
      && github.repository == 'smormah/vsift'
      && startsWith(github.ref, 'refs/tags/v')
      && needs.plan.outputs.mode == 'publish'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      id-token: write
      attestations: write
    steps:
      - name: Fetch the archives
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-dry-run
          path: dist

      - name: Fetch the npm tarballs
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: npm-packages
          path: npm-packages

      - name: Fetch the plan
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: publish-plan
          path: publish-plan

      - name: Require every subject to be the checked, qualified and planned one
        env:
          ARCHIVE_SUMS: ${{ needs.package.outputs.archive-sums }}
          TARBALL_SUMS: ${{ needs.npm-package.outputs.tarball-sums }}
          PLAN_SUMS: ${{ needs.plan.outputs.plan-sums }}
        run: |
          set -euo pipefail
          # require_exactly <directory> <sha256sum list>: every listed file
          # with its digest, and nothing else.
          require_exactly() {
            (cd "$1" && sha256sum --check --strict "$2")
            test "$(ls -A "$1" | wc -l)" -eq "$(wc -l < "$2")"
          }
          printf '%s\n' "${PLAN_SUMS}" > "${RUNNER_TEMP}/plan-sums"
          require_exactly publish-plan "${RUNNER_TEMP}/plan-sums"
          printf '%s\n' "${ARCHIVE_SUMS}" | cmp - dist/SHA256SUMS
          printf '%s\n' "${TARBALL_SUMS}" > "${RUNNER_TEMP}/tarball-sums"
          require_exactly npm-packages "${RUNNER_TEMP}/tarball-sums"
          mkdir subjects
          cp dist/* npm-packages/* subjects/
          cp publish-plan/*.cdx.json publish-plan/*.THIRD-PARTY-NOTICES.txt subjects/
          require_exactly subjects "${GITHUB_WORKSPACE}/publish-plan/attestation-subjects.sha256"

      - name: Attest every release asset and npm tarball
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: publish-plan/attestation-subjects.sha256

  # Only when publishing, after attest, and only once the maintainer approves
  # the `release` environment (its required reviewer; deployments limited to
  # v* tags). It runs no repository code and publishes exactly the tarballs
  # the npm-qualify jobs installed, by digest; nothing is rebuilt or repacked.
  publish:
    name: Publish to npm (next or latest) and GitHub Releases
    needs:
      - package
      - npm-package
      - npm-qualify
      - plan
      - attest
    if: >-
      github.event_name == 'workflow_dispatch'
      && github.event.inputs.dry_run == 'false'
      && github.repository == 'smormah/vsift'
      && startsWith(github.ref, 'refs/tags/v')
      && needs.plan.outputs.mode == 'publish'
    runs-on: ubuntu-24.04
    # Publishing takes a few minutes, the read-back of the dist-tags up to 20
    # and the GitHub release about one.
    timeout-minutes: 45
    environment:
      name: release
      url: https://www.npmjs.com/package/vsift-cli/v/${{ needs.plan.outputs.version }}
    concurrency:
      group: release-publish
      cancel-in-progress: false
    # `actions: read` is for the re-check of the Nightly runs after the
    # approval; the two write scopes are the publish's own.
    permissions:
      actions: read
      id-token: write
      contents: write
    env:
      npm_config_update_notifier: "false"
      npm_config_registry: https://registry.npmjs.org/
    steps:
      - name: Set up the pinned Node.js (npm 11 publishes with trusted publishing)
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.PUBLISH_NODE_VERSION }}
          package-manager-cache: false

      - name: Fetch the archives
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-dry-run
          path: dist

      - name: Fetch the npm tarballs
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: npm-packages
          path: npm-packages

      - name: Fetch the plan
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: publish-plan
          path: publish-plan

      - name: Require every file to be the checked, qualified and planned one
        env:
          ARCHIVE_SUMS: ${{ needs.package.outputs.archive-sums }}
          TARBALL_SUMS: ${{ needs.npm-package.outputs.tarball-sums }}
          PLAN_SUMS: ${{ needs.plan.outputs.plan-sums }}
        run: |
          set -euo pipefail
          require_exactly() {
            (cd "$1" && sha256sum --check --strict "$2")
            test "$(ls -A "$1" | wc -l)" -eq "$(wc -l < "$2")"
          }
          printf '%s\n' "${PLAN_SUMS}" > "${RUNNER_TEMP}/plan-sums"
          require_exactly publish-plan "${RUNNER_TEMP}/plan-sums"
          printf '%s\n' "${ARCHIVE_SUMS}" | cmp - dist/SHA256SUMS
          printf '%s\n' "${TARBALL_SUMS}" > "${RUNNER_TEMP}/tarball-sums"
          require_exactly npm-packages "${RUNNER_TEMP}/tarball-sums"
          mkdir release-assets
          cp dist/* release-assets/
          cp publish-plan/*.cdx.json publish-plan/*.THIRD-PARTY-NOTICES.txt release-assets/
          require_exactly release-assets "${GITHUB_WORKSPACE}/publish-plan/release-assets.sha256"

      # The four packages' dist-tags before anything is published, as the
      # plan job read them (#403's recovery): never read again here, because a
      # re-run of failed jobs after a partial publish would read the new tags,
      # or a stale copy of them. A publication moves exactly one tag of each
      # package (`next` for a pre-release, `latest` for a stable version) and
      # leaves the other where it was; the steps after the publish check both.
      # `none` stands for a tag that is not set; a package the plan could not
      # read stops the publish here.
      - name: Record the dist-tags before publishing
        env:
          TAGS_BEFORE: ${{ needs.plan.outputs.tags-before }}
        run: |
          set -euo pipefail
          printf '%s\n' "${TAGS_BEFORE}" > "${RUNNER_TEMP}/plan-tags"
          test "$(cut -d ' ' -f 1 "${RUNNER_TEMP}/plan-tags" | paste -sd ' ' -)" = "@vsift/darwin-arm64 @vsift/win32-x64 @vsift/linux-x64 vsift-cli"
          for package in @vsift/darwin-arm64 @vsift/win32-x64 @vsift/linux-x64 vsift-cli; do
            read -r name latest next rest < <(grep -m 1 "^${package} " "${RUNNER_TEMP}/plan-tags")
            if [ -n "${rest:-}" ] || [ "${latest}" = unknown ] || [ "${next}" = unknown ]; then
              echo "the plan could not read npm's dist-tags of ${name}; dispatch the tag again" >&2
              exit 1
            fi
            printf '%s %s %s\n' "${package}" "${latest}" "${next}" >> "${RUNNER_TEMP}/tags-before"
            echo "${package}: latest ${latest}, next ${next}"
          done

      # The guard's conditions again, after the approval and just before the
      # first publication (the maintainer's decision of 2026-10-17): the
      # approval can come days after the dispatch, and nothing may be published
      # that no longer qualifies. A dispatch with dry_run cleared, in
      # smormah/vsift, on the tag of the planned version; the tag still names
      # the commit this run built; that commit still on its protected release
      # branch; and for a pre-release (a candidate) the latest Nightly run that
      # tested exactly that commit still passed. The four functions are the
      # guard's, character for character (the lint compares them), so the rules
      # cannot drift apart; only reads of GitHub, no build, no checkout.
      - name: Re-check the guard's conditions after the approval, before anything is published
        env:
          EVENT_NAME: ${{ github.event_name }}
          GIT_REF: ${{ github.ref }}
          REPOSITORY: ${{ github.repository }}
          DRY_RUN_INPUT: ${{ github.event.inputs.dry_run }}
          SOURCE_COMMIT: ${{ github.sha }}
          VERSION: ${{ needs.plan.outputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          refuse() {
            echo "Refused after the approval, before anything is published: $*" >&2
            printf '## Publish: refused after the approval, nothing is published\n\n%s\n' "$*" >> "${GITHUB_STEP_SUMMARY}"
            exit 1
          }
          # nightly_passed: whether the latest Nightly run that tested exactly
          # SOURCE_COMMIT passed, with no run of it still in progress (the rules are
          # in the guard job's comment); sets `verdict` either way.
          nightly_passed() {
            local runs_filter jobs_filter runs started id status conclusion jobs ran failing
            runs_filter='.workflow_runs[] | select(.event == "schedule" or .event == "workflow_dispatch") | "\(.run_started_at) \(.id) \(.status) \(.conclusion)"'
            jobs_filter='.jobs[] | "\(.conclusion // "unfinished")\t\(.name)"'
            runs="$(gh api "repos/smormah/vsift/actions/workflows/nightly.yml/runs?head_sha=${SOURCE_COMMIT}&per_page=100" --jq "${runs_filter}")" || {
              verdict="the Nightly runs of ${SOURCE_COMMIT} could not be read"
              return 1
            }
            while read -r started id status conclusion; do
              if [ -n "${id}" ] && [ "${status}" != completed ]; then
                verdict="Nightly run ${id} of ${SOURCE_COMMIT} is still ${status}: wait for it to finish, then dispatch again"
                return 1
              fi
            done <<< "${runs}"
            while read -r started id status conclusion; do
              [ -n "${id}" ] || continue
              jobs="$(gh api "repos/smormah/vsift/actions/runs/${id}/jobs?per_page=100" --jq "${jobs_filter}")" || {
                verdict="the jobs of Nightly run ${id} could not be read"
                return 1
              }
              ran="$(printf '%s\n' "${jobs}" | awk -F '\t' '$2 != "" && $1 != "skipped" { n++ } END { print n + 0 }')"
              if [ "${ran}" -le 1 ]; then
                echo "Nightly run ${id} (${started}) ran no check (nothing new on main that night): passed over"
                continue
              fi
              failing="$(printf '%s\n' "${jobs}" | awk -F '\t' '$2 != "" && $2 != "Report a failure" && $1 != "success" { list = list sep $2 " (" $1 ")"; sep = ", " } END { print list }')"
              if [ "${conclusion}" = success ] && [ -z "${failing}" ]; then
                verdict="Nightly run ${id} (${started}) passed on ${SOURCE_COMMIT}"
                return 0
              fi
              verdict="the latest Nightly run that tested ${SOURCE_COMMIT}, run ${id} (${started}), concluded ${conclusion}${failing:+, with ${failing}}"
              return 1
            done < <(printf '%s\n' "${runs}" | sort -r)
            verdict="no Nightly run has tested ${SOURCE_COMMIT}"
            return 1
          }
          # on_release_branch: whether SOURCE_COMMIT is on the release branch, read
          # by the branch head's own commit (a tag of the same name cannot stand in
          # for the branch); sets `verdict` when it is not. On an error gh prints
          # GitHub's error body, not the filter's answer: only the exit status counts.
          on_release_branch() {
            local head status
            head="$(gh api "repos/smormah/vsift/git/ref/heads/${release_branch}" --jq .object.sha)" || head=""
            if ! [[ "${head}" =~ ^[0-9a-f]{40}$ ]]; then
              verdict="${release_branch} does not exist or could not be read"
              return 1
            fi
            status="$(gh api "repos/smormah/vsift/compare/${SOURCE_COMMIT}...${head}?per_page=1" --jq .status)" || status=""
            case "${status}" in
              identical | ahead) return 0 ;;
              "") verdict="the comparison of ${SOURCE_COMMIT} with ${release_branch} (${head}) could not be read" ;;
              *) verdict="${SOURCE_COMMIT} is not on ${release_branch} (GitHub's comparison with its head ${head} says '${status}')" ;;
            esac
            return 1
          }
          # tag_commit: the commit the tag names now, an annotated tag peeled, in
          # `tagged`; empty when GitHub cannot say. A tag moved after the dispatch
          # must not get this run's build.
          tag_commit() {
            local ref_filter answer type sha
            ref_filter='"\(.object.type) \(.object.sha)"'
            tagged=""
            answer="$(gh api "repos/smormah/vsift/git/ref/tags/${tag}" --jq "${ref_filter}")" || answer=""
            for _ in 1 2 3 4; do
              read -r type sha <<< "${answer}"
              [[ "${sha}" =~ ^[0-9a-f]{40}$ ]] || return 1
              case "${type}" in
                commit)
                  tagged="${sha}"
                  return 0
                  ;;
                tag) answer="$(gh api "repos/smormah/vsift/git/tags/${sha}" --jq "${ref_filter}")" || answer="" ;;
                *) return 1 ;;
              esac
            done
            return 1
          }
          # release_branch_protected: whether the rulesets that apply to the release
          # branch hold the five rule types of release.md 6.2 step 8; sets `verdict`
          # when they do not.
          release_branch_protected() {
            local rules rule missing
            rules="$(gh api "repos/smormah/vsift/rules/branches/${release_branch}?per_page=100" --jq '.[].type')" || {
              verdict="the rules of ${release_branch} could not be read"
              return 1
            }
            missing=""
            for rule in creation deletion non_fast_forward pull_request required_status_checks; do
              printf '%s\n' "${rules}" | grep -qx "${rule}" || missing="${missing:+${missing}, }${rule}"
            done
            [ -n "${missing}" ] || return 0
            verdict="the rulesets of ${release_branch} have no ${missing} rule (release.md 6.2 step 8)"
            return 1
          }

          [[ "${VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] || refuse "the planned version '${VERSION}' is not a release version"
          core="${VERSION%%-*}"
          release_branch="release/${core%.*}.x"
          tag="v${VERSION}"
          [ "${EVENT_NAME}" = workflow_dispatch ] && [ "${DRY_RUN_INPUT}" = false ] || refuse "only a dispatch with dry_run cleared publishes; this run is a ${EVENT_NAME} with dry_run '${DRY_RUN_INPUT}'"
          [ "${GIT_REF}" = "refs/tags/${tag}" ] || refuse "a publish runs only on the tag ${tag}; this run is on ${GIT_REF}"
          [ "${REPOSITORY}" = smormah/vsift ] || refuse "a release tag is dispatched only in smormah/vsift, not in ${REPOSITORY}"
          tag_commit || tagged=""
          [ "${tagged}" = "${SOURCE_COMMIT}" ] || refuse "the tag ${tag} names ${tagged:-nothing GitHub could read} now, not ${SOURCE_COMMIT}, the commit this run built (a re-run of a run from before the tag moved): dispatch the tag again"
          on_release_branch || refuse "the tag ${tag} must be on ${release_branch}, where candidates and stable releases are made: ${verdict}"
          release_branch_protected || refuse "a release is made only on a protected release branch: ${verdict}"
          if [[ "${VERSION}" == *-* ]]; then
            nightly_passed || refuse "a release candidate is published only while the latest Nightly run that tested its commit passed (governance rule 15): ${verdict}"
            echo "The nightly precondition still holds: ${verdict}."
          fi
          echo "After the approval, ${tag} (${SOURCE_COMMIT}, on ${release_branch}) still qualifies: publishing."

      # With trusted publishing npm exchanges the job's OIDC token for a
      # one-publish token and adds npm provenance. NPM_BOOTSTRAP_TOKEN exists
      # only for the first publish of a package that has no trusted publisher
      # yet, as a short-lived environment secret (release.md section 6); npm
      # expands it from the environment, so it is never written to disk.
      # A version already published with the same bytes is skipped, so a
      # re-run after a partial failure completes the release.
      #
      # The two publishing steps below are the two channels, each written out
      # in full with its own dist-tag, so no variable ever chooses between
      # `next` and `latest`. Each runs only for its channel and checks the
      # version's shape itself. They are identical from `npm_version=` on,
      # except for `--tag` (a vsift-release test holds that and the commands to
      # the plan's), and the lint (workflows/publish.rs) holds the pairing.
      - name: Publish the platform packages, then vsift-cli, under next (pre-release)
        if: needs.plan.outputs.channel == 'prerelease'
        env:
          VERSION: ${{ needs.plan.outputs.version }}
          NPM_BOOTSTRAP_TOKEN: ${{ secrets.NPM_BOOTSTRAP_TOKEN }}
        run: |
          set -euo pipefail
          [[ "${VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+-[0-9A-Za-z.-]+$ ]]
          npm_version="$(npm --version)"
          echo "npm ${npm_version}"
          case "${npm_version}" in
            11.5.[1-9]*|11.[6-9].*|11.[1-9][0-9].*|1[2-9].*) ;;
            *) echo "npm ${npm_version} cannot publish with trusted publishing (11.5.1 or later)" >&2; exit 1 ;;
          esac
          : > "${RUNNER_TEMP}/publish.npmrc"
          if [ -n "${NPM_BOOTSTRAP_TOKEN}" ]; then
            printf '%s\n' '//registry.npmjs.org/:_authToken=${NPM_BOOTSTRAP_TOKEN}' > "${RUNNER_TEMP}/publish.npmrc"
          fi
          export npm_config_userconfig="${RUNNER_TEMP}/publish.npmrc"
          for package in @vsift/darwin-arm64 @vsift/win32-x64 @vsift/linux-x64 vsift-cli; do
            file="${package#@}"
            file="${file//\//-}-${VERSION}.tgz"
            integrity="sha512-$(openssl dgst -sha512 -binary "npm-packages/${file}" | base64 -w 0)"
            published="$(npm view "${package}@${VERSION}" dist.integrity 2>/dev/null || true)"
            if [ "${published}" = "${integrity}" ]; then
              echo "${package}@${VERSION} is already published with these bytes"
              continue
            fi
            if [ -n "${published}" ]; then
              echo "${package}@${VERSION} is already published with other bytes" >&2
              exit 1
            fi
            npm publish "./npm-packages/${file}" --tag next --access public --provenance --ignore-scripts
          done

      # The stable channel moves `latest`, which this workflow can never take
      # back. Before anything is published, every package's `latest` must be a
      # stable version at or below this one (equal means a re-run completing a
      # partial publish). The plan checked that at plan time; this is the check
      # at publish time, after the approval's wait, so `latest` is read again
      # here, past npm's cache and cut off like every read, and must still be
      # what the plan saw or already this version: otherwise another stable
      # version was published during the wait (a higher one, which this
      # publish would move `latest` back from) and nothing is published.
      - name: Publish the platform packages, then vsift-cli, under latest (stable)
        if: needs.plan.outputs.channel == 'stable'
        env:
          VERSION: ${{ needs.plan.outputs.version }}
          NPM_BOOTSTRAP_TOKEN: ${{ secrets.NPM_BOOTSTRAP_TOKEN }}
        run: |
          set -euo pipefail
          [[ "${VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          test "${VERSION}" != "0.0.0"
          while read -r package latest next; do
            latest_now="$(timeout 20 npm view "${package}" dist-tags.latest --prefer-online --fetch-retries=1 2>/dev/null || true)"
            if [ "${latest_now}" != "${latest}" ] && [ "${latest_now}" != "${VERSION}" ]; then
              echo "${package}: latest is '${latest_now:-no answer}' now, not ${latest} as the plan read it nor ${VERSION}: nothing is published" >&2
              exit 1
            fi
            [[ "${latest}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
            test "$(printf '%s\n%s\n' "${latest}" "${VERSION}" | sort -V | tail -n 1)" = "${VERSION}"
          done < "${RUNNER_TEMP}/tags-before"
          npm_version="$(npm --version)"
          echo "npm ${npm_version}"
          case "${npm_version}" in
            11.5.[1-9]*|11.[6-9].*|11.[1-9][0-9].*|1[2-9].*) ;;
            *) echo "npm ${npm_version} cannot publish with trusted publishing (11.5.1 or later)" >&2; exit 1 ;;
          esac
          : > "${RUNNER_TEMP}/publish.npmrc"
          if [ -n "${NPM_BOOTSTRAP_TOKEN}" ]; then
            printf '%s\n' '//registry.npmjs.org/:_authToken=${NPM_BOOTSTRAP_TOKEN}' > "${RUNNER_TEMP}/publish.npmrc"
          fi
          export npm_config_userconfig="${RUNNER_TEMP}/publish.npmrc"
          for package in @vsift/darwin-arm64 @vsift/win32-x64 @vsift/linux-x64 vsift-cli; do
            file="${package#@}"
            file="${file//\//-}-${VERSION}.tgz"
            integrity="sha512-$(openssl dgst -sha512 -binary "npm-packages/${file}" | base64 -w 0)"
            published="$(npm view "${package}@${VERSION}" dist.integrity 2>/dev/null || true)"
            if [ "${published}" = "${integrity}" ]; then
              echo "${package}@${VERSION} is already published with these bytes"
              continue
            fi
            if [ -n "${published}" ]; then
              echo "${package}@${VERSION} is already published with other bytes" >&2
              exit 1
            fi
            npm publish "./npm-packages/${file}" --tag latest --access public --provenance --ignore-scripts
          done

      # npm's public metadata can show a publish minutes late (#403): about a
      # minute and a half for 0.1.0, two and a half for 0.2.0, and more than
      # five for one package of 0.2.1, which read right when the job was re-run
      # nine minutes after it failed. So each package's dist-tags are read
      # every 30 seconds until 20 minutes have passed (at most 40 rounds),
      # bypassing npm's own cache; each read is cut off after 20 seconds and
      # retried at most once inside npm, so a hung read cannot run the job
      # into its timeout (a round of 8 reads is at most 160 s, and the step
      # ends within about 23 minutes). A tag that still reads its value from before
      # the publish, or gives no answer, is still on its way; any other value
      # is a wrong answer and fails at once, and so does any move of the tag
      # that must stay. Only a registry that never settles fails on time, and
      # then the message says the packages were published (release.md 6.5).
      - name: Require next to be this version and latest to be untouched
        if: needs.plan.outputs.channel == 'prerelease'
        env:
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          set -euo pipefail
          deadline=$((SECONDS + 1200))
          settled=no
          for attempt in $(seq 1 40); do
            settled=yes
            while read -r package latest next; do
              next_now="$(timeout 20 npm view "${package}" dist-tags.next --prefer-online --fetch-retries=1 2>/dev/null || true)"
              latest_now="$(timeout 20 npm view "${package}" dist-tags.latest --prefer-online --fetch-retries=1 2>/dev/null || true)"
              if [ -n "${next_now}" ] && [ "${next_now}" != "${VERSION}" ] && [ "${next_now}" != "${next}" ]; then
                echo "${package}: next reads '${next_now}', which is neither ${VERSION} nor its value before the publish (${next}): a wrong answer" >&2
                exit 1
              fi
              if [ -n "${latest_now}" ] && [ "${latest_now}" != "${latest}" ]; then
                echo "${package}: latest reads '${latest_now}'; it was ${latest} before the publish and a pre-release never moves it" >&2
                exit 1
              fi
              if [ "${next_now}" != "${VERSION}" ] || { [ -z "${latest_now}" ] && [ "${latest}" != none ]; }; then
                settled=no
                echo "attempt ${attempt}: ${package} next '${next_now:-no answer}', latest '${latest_now:-no answer}'; waiting for next ${VERSION}"
              fi
            done < "${RUNNER_TEMP}/tags-before"
            if [ "${settled}" = yes ] || [ "${SECONDS}" -ge "${deadline}" ]; then
              break
            fi
            sleep 30
          done
          if [ "${settled}" != yes ]; then
            echo "npm accepted every publication above, but its metadata did not show next ${VERSION} with latest unchanged on all four packages within 20 minutes. Read the tags with npm view; when they are right, use Re-run failed jobs on this run (release.md 6.5)." >&2
            exit 1
          fi
          while read -r package latest next; do
            echo "${package}: next ${VERSION} (before: ${next}), latest ${latest} (unchanged)"
          done < "${RUNNER_TEMP}/tags-before"

      - name: Require latest to be this version and next to be untouched
        if: needs.plan.outputs.channel == 'stable'
        env:
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          set -euo pipefail
          deadline=$((SECONDS + 1200))
          settled=no
          for attempt in $(seq 1 40); do
            settled=yes
            while read -r package latest next; do
              latest_now="$(timeout 20 npm view "${package}" dist-tags.latest --prefer-online --fetch-retries=1 2>/dev/null || true)"
              next_now="$(timeout 20 npm view "${package}" dist-tags.next --prefer-online --fetch-retries=1 2>/dev/null || true)"
              if [ -n "${latest_now}" ] && [ "${latest_now}" != "${VERSION}" ] && [ "${latest_now}" != "${latest}" ]; then
                echo "${package}: latest reads '${latest_now}', which is neither ${VERSION} nor its value before the publish (${latest}): a wrong answer" >&2
                exit 1
              fi
              if [ -n "${next_now}" ] && [ "${next_now}" != "${next}" ]; then
                echo "${package}: next reads '${next_now}'; it was ${next} before the publish and a stable version never moves it" >&2
                exit 1
              fi
              if [ "${latest_now}" != "${VERSION}" ] || { [ -z "${next_now}" ] && [ "${next}" != none ]; }; then
                settled=no
                echo "attempt ${attempt}: ${package} latest '${latest_now:-no answer}', next '${next_now:-no answer}'; waiting for latest ${VERSION}"
              fi
            done < "${RUNNER_TEMP}/tags-before"
            if [ "${settled}" = yes ] || [ "${SECONDS}" -ge "${deadline}" ]; then
              break
            fi
            sleep 30
          done
          if [ "${settled}" != yes ]; then
            echo "npm accepted every publication above, but its metadata did not show latest ${VERSION} with next unchanged on all four packages within 20 minutes. Read the tags with npm view; when they are right, use Re-run failed jobs on this run (release.md 6.5): the GitHub release is created then." >&2
            exit 1
          fi
          while read -r package latest next; do
            echo "${package}: latest ${VERSION} (before: ${latest}), next ${next} (unchanged)"
          done < "${RUNNER_TEMP}/tags-before"

      # A draft first, so a release whose upload fails is never public; then
      # the draft is published as a pre-release that GitHub does not mark as
      # latest. The tag must exist already: the workflow never creates one.
      - name: Create the GitHub pre-release
        if: needs.plan.outputs.channel == 'prerelease'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.plan.outputs.version }}
          TAG: ${{ needs.plan.outputs.tag }}
        run: |
          set -euo pipefail
          test "${TAG}" = "v${VERSION}"
          gh release create "${TAG}" --repo smormah/vsift --verify-tag --draft --prerelease --latest=false \
            --title "VSift ${VERSION}" --notes-file publish-plan/release-notes.md release-assets/*
          gh release edit "${TAG}" --repo smormah/vsift --draft=false
          gh release view "${TAG}" --repo smormah/vsift

      # A stable release is created as a draft too, and marked latest once,
      # explicitly, when the draft is published. GitHub's own "latest release"
      # must then be this tag.
      - name: Create the GitHub release (stable) and mark it latest
        if: needs.plan.outputs.channel == 'stable'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.plan.outputs.version }}
          TAG: ${{ needs.plan.outputs.tag }}
        run: |
          set -euo pipefail
          test "${TAG}" = "v${VERSION}"
          gh release create "${TAG}" --repo smormah/vsift --verify-tag --draft \
            --title "VSift ${VERSION}" --notes-file publish-plan/release-notes.md release-assets/*
          gh release edit "${TAG}" --repo smormah/vsift --draft=false --latest
          gh release view "${TAG}" --repo smormah/vsift
          latest_release=""
          for attempt in 1 2 3 4 5; do
            latest_release="$(gh api repos/smormah/vsift/releases/latest --jq .tag_name || true)"
            if [ "${latest_release}" = "${TAG}" ]; then
              break
            fi
            echo "attempt ${attempt}: GitHub's latest release is '${latest_release}', waiting for ${TAG}"
            sleep 10
          done
          test "${latest_release}" = "${TAG}"
