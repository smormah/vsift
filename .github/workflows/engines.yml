name: Engines

# Builds the engines VSift makes itself where no publisher offers a suitable
# build (ADR 0032 sections D and E), and publishes one on this repository's
# releases under its engine tag; the managed catalogue then pins the asset by
# size and SHA-256 like any publisher's.
#
#   guard    first, in seconds: which engine, which mode, and for a publish
#            that the ref is the engine's tag, the tag still names this run's
#            commit, the commit is on `main` and no release of the tag exists.
#   build    one leg per engine, each on a GitHub-hosted runner: the pinned
#            upstream commit fetched and checked, built twice and compared
#            byte for byte, packaged deterministically
#            (tools/engines/build-engine.sh). On a dispatch only the chosen
#            engine's leg builds; a pull request builds all of them.
#   plan     the chosen engine's files checked against the build's sums and
#            the plan shown; it decides whether this run publishes.
#   attest   only when publishing: build provenance for every asset.
#   publish  only when publishing, in the protected `release` environment after
#            the maintainer's approval: a draft release on the existing tag
#            with exactly the planned files, then published, never marked
#            latest (`--latest=false` on both), never replacing an asset.
#
# Every run is a dry run except a manual dispatch on the engine's tag of
# smormah/vsift with `dry_run` cleared. Pull requests never publish. The lint in
# tools/vsift-governance (workflows/engines.rs) holds this file to these rules.
# Nothing here runs on the self-hosted runner, and no secret is named.
on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/engines.yml
      - tools/engines/**
  workflow_dispatch:
    inputs:
      engine:
        description: The engine to build (its recipe is tools/engines/recipes/<engine>.env)
        type: choice
        options:
          - whisper-cli-macos
          - whisper-cli-windows
          - ffmpeg-macos
          - ocr-runner
      dry_run:
        description: Dry run (build, check and show the plan; publish nothing). Choose the engine's tag <engine>-v<version> in "Use workflow from" and clear it only there to publish, after the release environment's approval.
        type: boolean
        default: true

permissions: {}

concurrency:
  group: engines-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

defaults:
  run:
    shell: bash

jobs:
  guard:
    name: Engine, ref and tag guard
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      engine: ${{ steps.decide.outputs.engine }}
      tag: ${{ steps.decide.outputs.tag }}
      mode: ${{ steps.decide.outputs.mode }}
    steps:
      - name: Check out the recipes
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: /tools/engines/recipes/
          sparse-checkout-cone-mode: false

      - name: Decide the engine and the mode, and refuse a wrong ref
        id: decide
        env:
          EVENT_NAME: ${{ github.event_name }}
          GIT_REF: ${{ github.ref }}
          REPOSITORY: ${{ github.repository }}
          ENGINE_INPUT: ${{ github.event.inputs.engine }}
          DRY_RUN_INPUT: ${{ github.event.inputs.dry_run }}
          SOURCE_COMMIT: ${{ github.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          refuse() {
            echo "Refused before anything is built: $*" >&2
            printf '## Engines: refused before anything is built\n\n%s\n' "$*" >> "${GITHUB_STEP_SUMMARY}"
            exit 1
          }
          note() {
            echo "$*"
            printf '%s\n\n' "$*" >> "${GITHUB_STEP_SUMMARY}"
          }
          # tag_commit: the commit the tag names now, an annotated tag peeled,
          # in `tagged`; empty when GitHub cannot say.
          tag_commit() {
            local ref_filter answer type sha
            ref_filter='"\(.object.type) \(.object.sha)"'
            tagged=""
            answer="$(gh api "repos/smormah/vsift/git/ref/tags/${tag}" --jq "${ref_filter}")" || answer=""
            for _ in 1 2 3 4; do
              read -r type sha <<< "${answer}"
              [[ "${sha}" =~ ^[0-9a-f]{40}$ ]] || return 1
              case "${type}" in
                commit)
                  tagged="${sha}"
                  return 0
                  ;;
                tag) answer="$(gh api "repos/smormah/vsift/git/tags/${sha}" --jq "${ref_filter}")" || answer="" ;;
                *) return 1 ;;
              esac
            done
            return 1
          }
          # on_main: whether SOURCE_COMMIT is on main (main's head is it or
          # after it); sets `verdict` when it is not.
          on_main() {
            local status
            status="$(gh api "repos/smormah/vsift/compare/${SOURCE_COMMIT}...main?per_page=1" --jq .status)" || status=""
            case "${status}" in
              identical | ahead) return 0 ;;
              "") verdict="the comparison of ${SOURCE_COMMIT} with main could not be read" ;;
              *) verdict="${SOURCE_COMMIT} is not on main (GitHub's comparison says '${status}')" ;;
            esac
            return 1
          }
          # no_release: whether the tag has no release yet; an engine release
          # is made once and never replaced.
          no_release() {
            local answer
            if answer="$(gh api "repos/smormah/vsift/releases/tags/${tag}" --jq .tag_name 2>&1)"; then
              return 1
            fi
            case "${answer}" in
              *"HTTP 404"*) return 0 ;;
              *) refuse "whether ${tag} has a release could not be read" ;;
            esac
          }

          if [ "${EVENT_NAME}" != workflow_dispatch ]; then
            {
              echo "engine=all"
              echo "tag="
              echo "mode=dry-run"
            } >> "${GITHUB_OUTPUT}"
            note "A ${EVENT_NAME} run builds every engine as a dry run and publishes nothing."
            exit 0
          fi
          case "${ENGINE_INPUT}" in
            whisper-cli-macos | whisper-cli-windows | ffmpeg-macos | ocr-runner) ;;
            *) refuse "the engine '${ENGINE_INPUT}' has no recipe" ;;
          esac
          recipe="tools/engines/recipes/${ENGINE_INPUT}.env"
          version="$(awk -F= '$1 == "ENGINE_VERSION" { print $2; exit }' "${recipe}")"
          [[ "${version}" =~ ^[0-9][0-9A-Za-z.]*-r[0-9]+$ ]] || refuse "${recipe} names no version of the form <upstream>-r<n> ('${version}')"
          tag="${ENGINE_INPUT}-v${version}"
          case "${DRY_RUN_INPUT}" in
            true) mode=dry-run ;;
            false) mode=publish ;;
            *) refuse "the dry_run input '${DRY_RUN_INPUT}' is neither true nor false" ;;
          esac
          {
            echo "engine=${ENGINE_INPUT}"
            echo "tag=${tag}"
          } >> "${GITHUB_OUTPUT}"
          if [ "${mode}" = dry-run ]; then
            echo "mode=dry-run" >> "${GITHUB_OUTPUT}"
            note "A dry run of ${ENGINE_INPUT} ${version} on ${GIT_REF}: it builds, checks and plans, and publishes nothing."
            exit 0
          fi
          [ "${GIT_REF}" = "refs/tags/${tag}" ] || refuse "a publish of ${ENGINE_INPUT} is dispatched on its tag ${tag}, never on ${GIT_REF}; or leave dry_run set"
          [ "${REPOSITORY}" = smormah/vsift ] || refuse "an engine is published only in smormah/vsift, not in ${REPOSITORY}"
          tag_commit || tagged=""
          [ "${tagged}" = "${SOURCE_COMMIT}" ] || refuse "the tag ${tag} names ${tagged:-nothing GitHub could read} now, not ${SOURCE_COMMIT}, the commit this run builds: dispatch the tag again"
          on_main || refuse "an engine is built only from a commit on main: ${verdict}"
          no_release || refuse "${tag} has a release already; an engine release is never replaced: raise the recipe's revision instead"
          echo "mode=publish" >> "${GITHUB_OUTPUT}"
          note "The publish of ${ENGINE_INPUT} ${version} (tag ${tag}) goes on to the build."

  build:
    name: Build ${{ matrix.engine }} for ${{ matrix.target }} twice and compare
    needs: guard
    strategy:
      fail-fast: false
      matrix:
        include:
          - engine: whisper-cli-macos
            target: macos-arm64
            os: macos-15
          - engine: whisper-cli-windows
            target: windows-x64
            os: windows-2025
          - engine: ffmpeg-macos
            target: macos-arm64
            os: macos-15
          # The OCR runner is VSift's own crate (ADR 0030); Linux is built on
          # Ubuntu 22.04, as VSift itself is, so it runs on newer glibc.
          - engine: ocr-runner
            target: linux-x64
            os: ubuntu-22.04
          - engine: ocr-runner
            target: windows-x64
            os: windows-2025
          - engine: ocr-runner
            target: macos-arm64
            os: macos-15
    runs-on: ${{ matrix.os }}
    timeout-minutes: 150
    permissions:
      contents: read
    steps:
      - name: Check out the recipes, build scripts and this repository's source
        if: needs.guard.outputs.engine == 'all' || needs.guard.outputs.engine == matrix.engine
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Test the packager
        if: needs.guard.outputs.engine == 'all' || needs.guard.outputs.engine == matrix.engine
        run: |
          if command -v python3 >/dev/null && python3 --version >/dev/null 2>&1; then python=python3; else python=python; fi
          "${python}" -m unittest discover -s tools/engines -p 'test_*.py'

      - name: Build twice from the pinned source, compare and package
        id: build
        if: needs.guard.outputs.engine == 'all' || needs.guard.outputs.engine == matrix.engine
        env:
          ENGINE_NAME: ${{ matrix.engine }}
          ENGINE_TARGET: ${{ matrix.target }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          # A pull request before the OCR runner's crate is on main builds the
          # other engines; a dispatch of an engine whose source is missing fails.
          crate="$(awk -F= '$1 == "CRATE" { print $2; exit }' "tools/engines/recipes/${ENGINE_NAME}.env")"
          if [ -n "${crate}" ] && [ ! -f "crates/${crate}/Cargo.toml" ] && [ "${EVENT_NAME}" = pull_request ]; then
            echo "built=false" >> "${GITHUB_OUTPUT}"
            printf '%s is not in this tree yet; its leg builds nothing on this pull request.\n' "${crate}" >> "${GITHUB_STEP_SUMMARY}"
            exit 0
          fi
          bash tools/engines/build-engine.sh "${ENGINE_NAME}" "${ENGINE_TARGET}"
          echo "built=true" >> "${GITHUB_OUTPUT}"

      - name: Keep the packaged engine for the plan
        if: steps.build.outputs.built == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: engine-${{ matrix.engine }}-${{ matrix.target }}
          path: dist/
          if-no-files-found: error

  plan:
    name: Plan the engine release
    needs:
      - guard
      - build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions: {}
    outputs:
      mode: ${{ steps.plan.outputs.mode }}
      sums: ${{ steps.plan.outputs.sums }}
    steps:
      - name: Fetch every target of the chosen engine
        if: needs.guard.outputs.engine != 'all'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: engine-${{ needs.guard.outputs.engine }}-*
          merge-multiple: true
          path: dist

      - name: Check every target's files against its sums and write the plan
        id: plan
        env:
          ENGINE_NAME: ${{ needs.guard.outputs.engine }}
          ENGINE_TAG: ${{ needs.guard.outputs.tag }}
          GUARD_MODE: ${{ needs.guard.outputs.mode }}
        run: |
          set -euo pipefail
          if [ "${ENGINE_NAME}" = all ]; then
            echo "mode=dry-run" >> "${GITHUB_OUTPUT}"
            echo "sums=" >> "${GITHUB_OUTPUT}"
            printf '## Engines: dry run of every engine\n\nEach build leg built its engine twice, compared and packaged it.\n' >> "${GITHUB_STEP_SUMMARY}"
            exit 0
          fi
          version="$(printf '%s\n' "${ENGINE_TAG}" | sed "s/^${ENGINE_NAME}-v//")"
          # Every target of the recipe built, each leg's files exactly its sums.
          : > "${RUNNER_TEMP}/sums"
          count=0
          for sums in dist/*.sha256; do
            (cd dist && sha256sum --check --strict "$(basename "${sums}")")
            cat "${sums}" >> "${RUNNER_TEMP}/sums"
            count=$((count + 1))
          done
          rm dist/*.sha256
          test "$(ls -A dist | wc -l)" -eq "$(wc -l < "${RUNNER_TEMP}/sums")"
          for name in $(ls dist); do
            case "${name}" in
              "${ENGINE_NAME}-${version}-"*) ;;
              *) echo "dist holds ${name}, not a file of ${ENGINE_NAME} ${version}" >&2; exit 1 ;;
            esac
          done
          LC_ALL=C sort -k2 "${RUNNER_TEMP}/sums" > dist/SHA256SUMS
          [ "${count}" -ge 1 ]
          {
            echo "mode=${GUARD_MODE}"
            echo "sums<<SUMS"
            cat dist/SHA256SUMS
            echo "SUMS"
          } >> "${GITHUB_OUTPUT}"
          {
            printf '## Engines: %s of %s\n\n' "${GUARD_MODE}" "${ENGINE_TAG}"
            printf '```\n'
            cat dist/SHA256SUMS
            printf '```\n'
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Keep the planned files for the attestation and the publish
        if: needs.guard.outputs.engine != 'all'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: planned-${{ needs.guard.outputs.engine }}
          path: dist/
          if-no-files-found: error

  # Only when publishing: a manual dispatch with dry_run cleared, on an engine
  # tag of smormah/vsift, which the guard and the plan accepted.
  attest:
    name: Attest build provenance
    needs:
      - guard
      - build
      - plan
    if: >-
      github.event_name == 'workflow_dispatch'
      && github.event.inputs.dry_run == 'false'
      && github.repository == 'smormah/vsift'
      && startsWith(github.ref, 'refs/tags/')
      && needs.plan.outputs.mode == 'publish'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      id-token: write
      attestations: write
    steps:
      - name: Fetch the planned engine
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: planned-${{ needs.guard.outputs.engine }}
          path: dist

      - name: Require exactly the planned files
        env:
          PLAN_SUMS: ${{ needs.plan.outputs.sums }}
        run: |
          set -euo pipefail
          printf '%s\n' "${PLAN_SUMS}" | cmp - dist/SHA256SUMS
          (cd dist && sha256sum --check --strict SHA256SUMS)
          test "$(ls -A dist | wc -l)" -eq "$(( $(wc -l < dist/SHA256SUMS) + 1 ))"

      - name: Attest every asset
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: dist/SHA256SUMS

  # Only when publishing, after attest, and only once the maintainer approves
  # the `release` environment.
  publish:
    name: Publish the engine release (never latest)
    needs:
      - guard
      - build
      - plan
      - attest
    if: >-
      github.event_name == 'workflow_dispatch'
      && github.event.inputs.dry_run == 'false'
      && github.repository == 'smormah/vsift'
      && startsWith(github.ref, 'refs/tags/')
      && needs.plan.outputs.mode == 'publish'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment:
      name: release
    concurrency:
      group: engines-publish
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - name: Fetch the planned engine
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: planned-${{ needs.guard.outputs.engine }}
          path: dist

      - name: Require exactly the planned files, and the tag still on this commit
        env:
          PLAN_SUMS: ${{ needs.plan.outputs.sums }}
          ENGINE_TAG: ${{ needs.guard.outputs.tag }}
          GIT_REF: ${{ github.ref }}
          SOURCE_COMMIT: ${{ github.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          printf '%s\n' "${PLAN_SUMS}" | cmp - dist/SHA256SUMS
          (cd dist && sha256sum --check --strict SHA256SUMS)
          test "$(ls -A dist | wc -l)" -eq "$(( $(wc -l < dist/SHA256SUMS) + 1 ))"
          [ "${GIT_REF}" = "refs/tags/${ENGINE_TAG}" ]
          tagged="$(gh api "repos/smormah/vsift/git/ref/tags/${ENGINE_TAG}" --jq '.object.sha')"
          type="$(gh api "repos/smormah/vsift/git/ref/tags/${ENGINE_TAG}" --jq '.object.type')"
          if [ "${type}" = tag ]; then
            tagged="$(gh api "repos/smormah/vsift/git/tags/${tagged}" --jq '.object.sha')"
          fi
          [ "${tagged}" = "${SOURCE_COMMIT}" ]

      - name: Create the release as a draft on the tag, then publish it, never as latest
        env:
          ENGINE_TAG: ${{ needs.guard.outputs.tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          {
            printf 'An engine VSift builds from a pinned upstream source for its managed installer (ADR 0032).\n\n'
            printf 'Not a VSift release: VSift itself is published under v<version> tags. '
            printf 'The managed catalogue pins these files by size and SHA-256; each carries a build provenance attestation '
            printf '(`gh attestation verify <file> --repo smormah/vsift`). The build information and, for an LGPL engine, '
            printf 'the corresponding source are among the assets.\n'
          } > "${RUNNER_TEMP}/notes.md"
          gh release create "${ENGINE_TAG}" --repo smormah/vsift --verify-tag --draft --latest=false \
            --title "${ENGINE_TAG}" --notes-file "${RUNNER_TEMP}/notes.md" dist/*
          gh release edit "${ENGINE_TAG}" --repo smormah/vsift --draft=false --latest=false
          gh release view "${ENGINE_TAG}" --repo smormah/vsift

      - name: Read the published assets back by digest
        env:
          ENGINE_TAG: ${{ needs.guard.outputs.tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/smormah/vsift/releases/tags/${ENGINE_TAG}" \
            --jq '.assets[] | "\(.digest | ltrimstr("sha256:"))  \(.name)"' | LC_ALL=C sort -k2 > "${RUNNER_TEMP}/published"
          LC_ALL=C sort -k2 dist/SHA256SUMS > "${RUNNER_TEMP}/planned"
          grep -v '  SHA256SUMS$' "${RUNNER_TEMP}/published" > "${RUNNER_TEMP}/published-files"
          cmp "${RUNNER_TEMP}/planned" "${RUNNER_TEMP}/published-files"
          test "$(gh api "repos/smormah/vsift/releases/latest" --jq .tag_name)" != "${ENGINE_TAG}"
