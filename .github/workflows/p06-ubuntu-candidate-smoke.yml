name: P06 Ubuntu candidate smoke

on:
  workflow_dispatch:

# Candidate bytes run only on a disposable host without repository credentials.
permissions: {}

jobs:
  candidate-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out synthetic fixture and qualification script
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Test candidate archive guardrails
        run: python -m unittest discover -s tools -p test_p06_ubuntu_candidate_smoke.py

      - name: Download pinned whisper.cpp archive for the Rust layout check
        env:
          VSIFT_P06_WHISPER_ARCHIVE: ${{ runner.temp }}/vsift-p06-whisper-v1.9.2.tar.gz
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          import sys

          sys.path.insert(0, str(Path.cwd() / "tools"))
          from p06_ubuntu_candidate_smoke import ARCHIVES
          from p06_windows_candidate_smoke import verified_download

          url, size, digest = ARCHIVES["whisper"]
          verified_download(url, Path(os.environ["VSIFT_P06_WHISPER_ARCHIVE"]), size, digest)
          PY

      - name: Exercise the production owned runtime layout with pinned bytes
        env:
          VSIFT_P06_WHISPER_ARCHIVE: ${{ runner.temp }}/vsift-p06-whisper-v1.9.2.tar.gz
        run: >-
          cargo test --locked -p vsift-infrastructure --test p06_whisper_archive
          pinned_upstream_archive_passes_contained_staging -- --ignored --exact --nocapture

      - name: Remove the Rust layout-check archive
        if: always()
        env:
          VSIFT_P06_WHISPER_ARCHIVE: ${{ runner.temp }}/vsift-p06-whisper-v1.9.2.tar.gz
        run: rm -f -- "$VSIFT_P06_WHISPER_ARCHIVE"

      - name: Download pinned FFmpeg archive for the Rust layout check
        env:
          VSIFT_P06_FFMPEG_ARCHIVE: ${{ runner.temp }}/vsift-p06-ffmpeg-month-end.tar.xz
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          import sys

          sys.path.insert(0, str(Path.cwd() / "tools"))
          from p06_ubuntu_candidate_smoke import ARCHIVES
          from p06_windows_candidate_smoke import verified_download

          url, size, digest = ARCHIVES["ffmpeg"]
          verified_download(url, Path(os.environ["VSIFT_P06_FFMPEG_ARCHIVE"]), size, digest)
          PY

      - name: Exercise the production owned FFmpeg runtime layout with pinned bytes
        env:
          VSIFT_P06_FFMPEG_ARCHIVE: ${{ runner.temp }}/vsift-p06-ffmpeg-month-end.tar.xz
        run: >-
          cargo test --locked -p vsift-infrastructure --test p06_ffmpeg_archive
          pinned_upstream_archive_passes_contained_staging -- --ignored --exact --nocapture

      - name: Remove the Rust FFmpeg layout-check archive
        if: always()
        env:
          VSIFT_P06_FFMPEG_ARCHIVE: ${{ runner.temp }}/vsift-p06-ffmpeg-month-end.tar.xz
        run: rm -f -- "$VSIFT_P06_FFMPEG_ARCHIVE"

      - name: Download pinned base model for the Rust raw-file layout check
        env:
          VSIFT_P06_BASE_MODEL: ${{ runner.temp }}/vsift-p06-ggml-base.bin
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          import sys

          sys.path.insert(0, str(Path.cwd() / "tools"))
          from p06_windows_candidate_smoke import MODEL_HASH, MODEL_SIZE, MODEL_URL, verified_download

          verified_download(MODEL_URL, Path(os.environ["VSIFT_P06_BASE_MODEL"]), MODEL_SIZE, MODEL_HASH)
          PY

      - name: Exercise the production owned base-model runtime layout
        env:
          VSIFT_P06_BASE_MODEL: ${{ runner.temp }}/vsift-p06-ggml-base.bin
        run: >-
          cargo test --locked -p vsift-infrastructure --test p06_model_artifact
          pinned_model_passes_owned_raw_payload_and_runtime_recheck -- --ignored --exact --nocapture

      - name: Remove the Rust model layout-check file
        if: always()
        env:
          VSIFT_P06_BASE_MODEL: ${{ runner.temp }}/vsift-p06-ggml-base.bin
        run: rm -f -- "$VSIFT_P06_BASE_MODEL"

      - name: Run pinned Ubuntu candidate compatibility smoke
        run: python tools/p06_ubuntu_candidate_smoke.py
