name: Flaky evidence 268 (temporary, this branch only)

# Re-runs the #268 test (an old, racy ordering of it) many times at once on a
# hosted macOS runner against the candidate fix. Temporary: it triggers only on
# a push to the branch below, reads the repository, publishes nothing, uses no
# secret, and is deleted with the branch. Never run on the maintainer's machine.

on:
  push:
    branches:
      - p14-pr7-flaky-evidence-268

permissions:
  contents: read

concurrency:
  group: flaky-evidence-268-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: never

jobs:
  sigterm-macos:
    name: "#268 sigterm test with the fix, macos-latest"
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build the test binary
        run: |
          cargo test -p vsift-cli --test job_run_cli_contract --no-run --locked --message-format=json > build.json
          sysctl -n hw.ncpu

      - name: Run the SIGTERM test many times at once
        env:
          RUNS: "800"
          PARALLEL: "6"
        run: |
          exe="$(grep '"executable"' build.json | grep '"name":"job_run_cli_contract"' | tail -n 1 | sed -E 's/.*"executable":"([^"]+)".*/\1/')"
          echo "test binary: $exe"
          mkdir -p runs
          export exe
          run_once() {
            n="$1"
            if "$exe" --exact sigterm_stops_a_request_resumably --nocapture > "runs/$n.log" 2>&1; then
              echo "$n pass"
            else
              echo "$n FAIL"
            fi
          }
          export -f run_once
          seq 1 "$RUNS" | xargs -P "$PARALLEL" -I{} bash -c 'run_once {}' > results.txt
          failed="$(grep -c FAIL results.txt || true)"
          echo "runs: $RUNS; failed: $failed"
          for n in $(grep FAIL results.txt | cut -d' ' -f1 | head -n 10); do
            echo "::group::FAILED run $n"
            cat "runs/$n.log"
            echo "::endgroup::"
          done
          echo "RESULT failed=$failed runs=$RUNS"
