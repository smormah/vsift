name: P14 malicious media

# P14 PR 4, evidence item RQ-10 (docs/planning/p14-qualification.md section 2):
# hostile media, subtitle and transcript sidecars and file names through the
# PUBLISHED vsift from the real registry, in a disposable container with no
# network, a read-only root and memory (1 GiB), process (128) and CPU (2)
# limits, on a hosted Ubuntu 24.04 runner. Every hostile input is generated by
# code at run time from the corpus's own fixtures (decompression bombs, absurd
# dimensions and durations, many streams, damaged and truncated containers,
# container nesting, external references, huge metadata, extreme sidecars,
# pathological names); nothing is downloaded, no real exploit or malware is used
# and nothing hostile is committed. Each operation must end in a typed failure
# (INVALID_SOURCE, RESOURCE_LIMIT or DEADLINE_EXCEEDED, or, where its case
# allows, a result) inside its bounds, with no hang, no network, no file outside
# the root, and nothing in its output a terminal would act on. A finding is an
# issue (governance rule 14), never a rerun. The findings already filed are
# listed in `TRACKED` in hostile-media.cjs: a run that finds only those passes
# (and says so in its summary), a new finding or a broken containment check
# fails it.
#
# NEVER on a developer's machine: it builds a FIFO, a 30 GiB sparse file and a
# 512 MiB file under /srv/vsift and starts containers. It cannot publish
# anything: it has `contents: read` only and uses no secret; it installs only
# the published package, the Ubuntu packages of its image and the three
# reviewed tools from their publishers, as P13 managed smoke does.
#
# Triggers: a pull request that changes this workflow or its tools, and a
# manual dispatch.
on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/p14-malicious-media.yml
      - tools/p14-campaigns/hostile-media.cjs
      - tools/p14-campaigns/lib/hostile-cases.cjs
      - tools/p14-campaigns/lib/hostile-judge.cjs
      - tools/p14-campaigns/lib/mp4.cjs
      - tools/p14-campaigns/lib/ebml.cjs
      - tools/p14-campaigns/lib/png.cjs
  workflow_dispatch:
    inputs:
      version:
        description: The published version of vsift-cli to run. Empty means the version on the next tag.
        type: string
        default: ""
      only:
        description: Run only the cases whose id starts with this, or one group (damaged, declared, nesting, metadata, external, streams, bomb, size, sidecar, names). Empty means all.
        type: string
        default: ""

permissions: {}

concurrency:
  group: p14-malicious-media-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

env:
  NODE_VERSION: "22.23.3"

jobs:
  tooling-tests:
    name: Tooling tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up the pinned Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false

      - name: Test the campaign tools
        run: node --test "tools/p14-campaigns/test/*.test.cjs"

  hostile:
    name: Hostile inputs (Ubuntu 24.04, no network, limits)
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up the pinned Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false

      - name: Record the host
        run: |
          uname -a
          nproc
          free -m
          df -h / /tmp
          docker --version
          stat -fc 'cgroup filesystem: %T' /sys/fs/cgroup

      - name: Prepare the worker host with the published binary
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          node tools/p14-campaigns/prepare-host.cjs \
            --work "${RUNNER_TEMP}/p14" \
            --out "${RUNNER_TEMP}/hostile-out" \
            --repo "${GITHUB_WORKSPACE}" \
            --version "${VERSION}"

      - name: Generate the hostile inputs and run each in the container
        env:
          ONLY: ${{ inputs.only }}
        run: |
          set -euo pipefail
          only_args=()
          if [ -n "$ONLY" ]; then
            only_args=(--only "$ONLY")
          fi
          node tools/p14-campaigns/hostile-media.cjs \
            --out "${RUNNER_TEMP}/hostile-out" \
            --repo "${GITHUB_WORKSPACE}" \
            ${only_args[@]+"${only_args[@]}"}

      - name: Put the result in the job summary
        if: always()
        run: |
          if [ -f "${RUNNER_TEMP}/hostile-out/hostile-summary.md" ]; then
            cat "${RUNNER_TEMP}/hostile-out/hostile-summary.md" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Keep the result
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: p14-malicious-media
          path: ${{ runner.temp }}/hostile-out
          if-no-files-found: warn
          retention-days: 90
