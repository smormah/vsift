name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  governance:
    name: Governance
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate delivery ledger and fixture corpus
        run: cargo run --locked -p vsift-governance -- check

  quality:
    name: Quality (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Show toolchain
        run: rustup show active-toolchain

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Lint
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

      - name: Test
        run: cargo test --workspace --locked -- --nocapture

      - name: Record storage probe filesystem (Linux)
        if: runner.os == 'Linux'
        run: |
          uname -a
          cat /etc/os-release
          findmnt --target "${TMPDIR:-/tmp}" --output SOURCE,FSTYPE,OPTIONS

      - name: Record storage probe filesystem (macOS)
        if: runner.os == 'macOS'
        run: |
          sw_vers
          uname -m
          df "$TMPDIR"
          diskutil info "$(df "$TMPDIR" | tail -n 1 | awk '{print $1}')"

      - name: Record storage probe filesystem (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Get-CimInstance Win32_OperatingSystem | Select-Object Caption,Version,BuildNumber | ConvertTo-Json -Compress
          Get-Volume -FilePath $env:TEMP | Select-Object DriveLetter,FileSystemType,HealthStatus | ConvertTo-Json -Compress

      - name: Build release binary
        run: cargo build --workspace --release --locked

  documentation:
    name: Documentation
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build documentation
        run: cargo doc --workspace --no-deps --locked

  strict-worker-boundary:
    name: Strict worker boundary (Ubuntu 24.04)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build process qualification fixture
        run: cargo test --locked -p vsift-infrastructure --test process_supervisor --no-run

      - name: Verify inherited container and cgroup controls
        shell: bash
        run: |
          set -euo pipefail
          test_binary="$(find target/debug/deps -maxdepth 1 -type f -name 'process_supervisor-*' -perm -111 | head -n 1)"
          test -n "${test_binary}"
          docker run --rm \
            --network none \
            --read-only \
            --pids-limit 64 \
            --memory 512m \
            --memory-swap 512m \
            --cpus 1 \
            --cap-drop ALL \
            --security-opt no-new-privileges \
            --user 65534:65534 \
            --env VSIFT_STRICT_WORKER_TEST=1 \
            --volume "${PWD}:/workspace:ro" \
            --workdir /workspace \
            ubuntu@sha256:a61567bd31828687156d735ea8eb01ba4e37636e225dd6a48ba94136a70d9d61 \
            "/workspace/${test_binary}" \
            --exact p08_qualified_linux_host_reports_inherited_kernel_controls \
            --nocapture --test-threads=1
