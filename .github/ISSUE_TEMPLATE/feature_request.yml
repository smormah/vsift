name: Feature request
description: Propose a focused improvement to VSift
title: "feature: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Describe the user problem before proposing an implementation.
    validations:
      required: true

  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
      description: What should a user or agent be able to accomplish?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered

  - type: textarea
    id: lifecycle
    attributes:
      label: Security, privacy, and data lifecycle
      description: Consider media retention, generated evidence, external processes, downloads, and logs.

  - type: checkboxes
    id: checks
    attributes:
      label: Submission checks
      options:
        - label: I searched existing issues and pull requests.
          required: true
        - label: I have not included confidential recordings, transcripts, or credentials.
          required: true

