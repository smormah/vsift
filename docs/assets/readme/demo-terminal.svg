<circle cx="26" cy="22" r="6" fill="#e5535a" opacity="0.85"/><circle cx="46" cy="22" r="6" fill="#f5b942" opacity="0.85"/><circle cx="66" cy="22" r="6" fill="#2dd4bf" opacity="0.85"/>
<text x="490.0" y="27" font-size="12.5" class="s mu" text-anchor="middle">real output · a build of the main branch · trimmed for length</text>
<g clip-path="url(#termclip)">
<g class="l0"><text x="28" y="78" font-size="13" class="m" fill="#2dd4bf">$</text><text x="44" y="78" font-size="13" class="m t">vsift ingest ./walkthrough.mp4</text><rect class="c0" x="43" y="63" width="250" height="21" fill="#0e1a2b"/></g>
<text class="l1 m" x="28" y="99" font-size="13" fill="#9fb2c8"><tspan>Opened session </tspan><tspan fill="#2dd4bf">ses_477beb509a9ca0dca8ce010caef54bdb</tspan></text>
<g class="l2"><text x="28" y="130" font-size="13" class="m" fill="#2dd4bf">$</text><text x="44" y="130" font-size="13" class="m t">vsift transcript retranscribe ses_477beb50…</text><rect class="c2" x="43" y="115" width="358" height="21" fill="#0e1a2b"/></g>
<text class="l3 m" x="28" y="151" font-size="13" fill="#9fb2c8"><tspan>Revision 1: </tspan><tspan fill="#2dd4bf">trv_ee2e0040…</tspan><tspan> (local_asr, language en, segments in all: 1)</tspan></text>
<g class="l4"><text x="28" y="182" font-size="13" class="m" fill="#2dd4bf">$</text><text x="44" y="182" font-size="13" class="m t">vsift search ses_477beb50… --query "1017"</text><rect class="c4" x="43" y="167" width="342" height="21" fill="#0e1a2b"/></g>
<text class="l5 m" x="28" y="203" font-size="13" fill="#9fb2c8"><tspan fill="#2dd4bf">tsg_2d12cbeb…</tspan><tspan>  </tspan><tspan fill="#f5b942">00:00:00.000000</tspan><tspan> --&gt; </tspan><tspan fill="#f5b942">00:00:07.000000</tspan><tspan>  match: phrase</tspan></text>
<text class="l6 m" x="28" y="224" font-size="13" fill="#9fb2c8"><tspan fill="#e8eef6">  | Scroll to Order 1017. The status changes from queued to failed, while the header remains fixed.</tspan></text>
<g class="l7"><text x="28" y="255" font-size="13" class="m" fill="#2dd4bf">$</text><text x="44" y="255" font-size="13" class="m t">vsift candidates ses_477beb50… --from 0 --to 14000000</text><rect class="c7" x="43" y="240" width="442" height="21" fill="#0e1a2b"/></g>
<text class="l8 m" x="28" y="276" font-size="13" fill="#9fb2c8"><tspan fill="#2dd4bf">vcd_39f16b3a…</tspan><tspan>  at </tspan><tspan fill="#f5b942">00:00:00.000000</tspan><tspan>  first_frame</tspan></text>
<text class="l9 m" x="28" y="297" font-size="13" fill="#9fb2c8"><tspan fill="#2dd4bf">vcd_822b22cc…</tspan><tspan>  at </tspan><tspan fill="#f5b942">00:00:07.000000</tspan><tspan>  visual_change</tspan></text>
<text class="l10 m" x="28" y="318" font-size="13" fill="#9fb2c8"><tspan fill="#2dd4bf">vcd_d80c7914…</tspan><tspan>  at </tspan><tspan fill="#f5b942">00:00:10.000000</tspan><tspan>  visual_change</tspan></text>
<g class="l11"><text x="28" y="349" font-size="13" class="m" fill="#2dd4bf">$</text><text x="44" y="349" font-size="13" class="m t">vsift frame get ses_477beb50… --candidate vcd_d80c7914…</text><rect class="c11" x="43" y="334" width="458" height="21" fill="#0e1a2b"/></g>
<text class="l12 m" x="28" y="370" font-size="13" fill="#9fb2c8"><tspan fill="#2dd4bf">evd_2243ab20…</tspan><tspan>  frame at </tspan><tspan fill="#f5b942">00:00:10.000000</tspan><tspan>, 1440x900 (stream 0, pts 102400)</tspan></text>
<text class="l13 m" x="28" y="391" font-size="13" fill="#9fb2c8"><tspan>  Image 1440x900, 25741 bytes, sha256 eb8702ef…</tspan></text>
<text class="l14 m" x="28" y="422" font-size="13" fill="#f5b942"># This draft report was written for the demo. Its last claim cites a frame that does not exist.</text>
<g class="l15"><text x="28" y="443" font-size="13" class="m" fill="#2dd4bf">$</text><text x="44" y="443" font-size="13" class="m t">grep -m1 -o 'At 00:12.*' draft.md</text><rect class="c15" x="43" y="428" width="275" height="21" fill="#0e1a2b"/></g>
<text class="l16 m" x="28" y="464" font-size="13" fill="#9fb2c8"><tspan fill="#e8eef6">At 00:12 order 1017 is retried and shows COMPLETED [c4: e4].</tspan></text>
<g class="l17"><text x="28" y="495" font-size="13" class="m" fill="#2dd4bf">$</text><text x="44" y="495" font-size="13" class="m t">vsift handoff check --session ses_477beb50… &lt; draft.md</text><rect class="c17" x="43" y="480" width="450" height="21" fill="#0e1a2b"/></g>
<text class="l18 m" x="28" y="516" font-size="13" fill="#9fb2c8"><tspan>Handoff check: </tspan><tspan fill="#e5535a">not valid, 1 problem(s) to fix before sending</tspan></text>
<text class="l19 m" x="28" y="537" font-size="13" fill="#9fb2c8"><tspan>- at /citations/3/evidence_id (</tspan><tspan fill="#e5535a">evidence_not_in_session</tspan><tspan>)</tspan></text>
<text class="l20 m" x="28" y="558" font-size="13" fill="#9fb2c8"><tspan>  This evidence id is not in the session's evidence records; copy the evidence_id from …</tspan></text>
<g class="l21"><text x="28" y="589" font-size="13" class="m" fill="#2dd4bf">$</text><text x="44" y="589" font-size="13" class="m t">vsift handoff check --session ses_477beb50… &lt; report.md</text><rect class="c21" x="43" y="574" width="458" height="21" fill="#0e1a2b"/></g>
<text class="l22 m" x="28" y="610" font-size="13" fill="#9fb2c8"><tspan>Handoff check: </tspan><tspan fill="#2dd4bf">valid</tspan></text>
<text class="l23 m" x="28" y="631" font-size="13" fill="#9fb2c8"><tspan>Session: ses_477beb50…, 3 cited identities checked</tspan></text>
<g class="lz"><text x="28" y="662" font-size="13" class="m" fill="#2dd4bf">$</text><rect class="cur" x="44" y="650" width="8" height="15" fill="#e8eef6"/></g>
