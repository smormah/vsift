<svg xmlns="http://www.w3.org/2000/svg" width="980" height="701" viewBox="0 0 980 701" role="img" aria-labelledby="title desc" xml:space="preserve">
<title id="title">VSift terminal demo</title>
<desc id="desc">An animated terminal replaying real, trimmed output from vsift-cli 0.2.1 on a 14-second synthetic recording: ingest opens a session; local speech recognition transcribes it; a search for 1017 finds the narration from 0 to 7 seconds, first as text for people and then as a brief JSON answer for programs; candidates lists screen changes at 0, 7 and 10 seconds; frame get returns the 1440 by 900 frame at 10 seconds with its hash; crop cuts the 1017 FAILED row out of it; and handoff check finds a draft report valid, with its 4 cited identities checked in the session.</desc>
