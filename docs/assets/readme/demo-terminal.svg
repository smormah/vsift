11{0%,36.11%{opacity:0}36.12%,97%{opacity:1}100%{opacity:0}}.l11{animation:l11 30.8s linear infinite}@keyframes c11{0%,36.11%{transform:translateX(0);animation-timing-function:steps(55,end)}41.83%,100%{transform:translateX(458px)}}.c11{transform:translateX(458px);animation:c11 30.8s linear infinite}@keyframes l12{0%,42.96%{opacity:0}42.97%,97%{opacity:1}100%{opacity:0}}.l12{animation:l12 30.8s linear infinite}@keyframes l13{0%,43.41%{opacity:0}43.42%,97%{opacity:1}100%{opacity:0}}.l13{animation:l13 30.8s linear infinite}@keyframes l14{0%,46.14%{opacity:0}46.15%,97%{opacity:1}100%{opacity:0}}.l14{animation:l14 30.8s linear infinite}@keyframes l15{0%,51.33%{opacity:0}51.34%,97%{opacity:1}100%{opacity:0}}.l15{animation:l15 30.8s linear infinite}@keyframes c15{0%,51.33%{transform:translateX(0);animation-timing-function:steps(33,end)}54.77%,100%{transform:translateX(275px)}}.c15{transform:translateX(275px);animation:c15 30.8s linear infinite}@keyframes l16{0%,55.90%{opacity:0}55.91%,97%{opacity:1}100%{opacity:0}}.l16{animation:l16 30.8s linear infinite}@keyframes l17{0%,58.63%{opacity:0}58.64%,97%{opacity:1}100%{opacity:0}}.l17{animation:l17 30.8s linear infinite}@keyframes c17{0%,58.63%{transform:translateX(0);animation-timing-function:steps(54,end)}64.25%,100%{transform:translateX(450px)}}.c17{transform:translateX(450px);animation:c17 30.8s linear infinite}@keyframes l18{0%,65.37%{opacity:0}65.38%,97%{opacity:1}100%{opacity:0}}.l18{animation:l18 30.8s linear infinite}@keyframes l19{0%,65.83%{opacity:0}65.84%,97%{opacity:1}100%{opacity:0}}.l19{animation:l19 30.8s linear infinite}@keyframes l20{0%,66.28%{opacity:0}66.29%,97%{opacity:1}100%{opacity:0}}.l20{animation:l20 30.8s linear infinite}@keyframes l21{0%,69.01%{opacity:0}69.02%,97%{opacity:1}100%{opacity:0}}.l21{animation:l21 30.8s linear infinite}@keyframes c21{0%,69.01%{transform:translateX(0);animation-timing-function:steps(55,end)}74.73%,100%{transform:translateX(458px)}}.c21{transform:translateX(458px);animation:c21 30.8s linear infinite}@keyframes l22{0%,75.86%{opacity:0}75.87%,97%{opacity:1}100%{opacity:0}}.l22{animation:l22 30.8s linear infinite}@keyframes l23{0%,76.31%{opacity:0}76.32%,97%{opacity:1}100%{opacity:0}}.l23{animation:l23 30.8s linear infinite}@keyframes lz{0%,77.42%{opacity:0}77.43%,97%{opacity:1}100%{opacity:0}}.lz{animation:lz 30.8s linear infinite}@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}.cur{animation:blink 1.1s step-end infinite}@media (prefers-reduced-motion: reduce){*{animation:none !important}.cur{opacity:1}}</style>
