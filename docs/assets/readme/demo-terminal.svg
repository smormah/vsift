<svg xmlns="http://www.w3.org/2000/svg" width="980" height="688" viewBox="0 0 980 688" role="img" aria-labelledby="title desc" xml:space="preserve">
<title id="title">VSift terminal demo: a made-up claim is refused</title>
<desc id="desc">An animated terminal replaying real, trimmed output from a build of VSift's main branch on a 14-second synthetic recording. ingest opens a session, local speech recognition transcribes it, a search for 1017 finds the narration from 0 to 7 seconds, candidates lists screen changes at 0, 7 and 10 seconds, and frame get returns the frame at 10 seconds with its hash. A draft report written for the demo then claims that at 12 seconds order 1017 is retried and shows COMPLETED, citing a frame that does not exist. handoff check refuses it with evidence_not_in_session. The report without that claim is valid, with 3 cited identities checked.</desc>
<style>
