<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="420" viewBox="0 0 1280 420" role="img" aria-labelledby="title desc" xml:space="preserve">
<title id="title">VSift: your videos in, searchable, cited evidence out</title>
<desc id="desc">The VSift logo and wordmark. Three frames of a recording pass through a sieve and come out as three cited evidence cards: speech from 0 to 7 seconds, a screen change at 10 seconds, and the frame showing order 1017 failed.</desc>
<style>
.s{font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif} .m{font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, monospace}
.t{fill:#e8eef6} .mu{fill:#9fb2c8} .di{fill:#62799a}
text{white-space:pre} .b{font-weight:600} .bb{font-weight:700}
</style>
<rect width="1280" height="420" rx="28" fill="#0e1a2b"/><rect x="0.5" y="0.5" width="1279" height="419" rx="28" fill="none" stroke="#25405f"/>
