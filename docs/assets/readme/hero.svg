<circle cx="56" cy="78.5" r="2.4" fill="#0e1a2b"/>
</g>
<text x="186" y="146" font-size="80" class="s t bb" text-anchor="start" letter-spacing="-1.5">VSift</text>
<text x="74" y="232" font-size="36" class="s t b" text-anchor="start" >Your videos in.</text>
<text x="74" y="278" font-size="36" class="s b" text-anchor="start" fill="#2dd4bf">Searchable, cited evidence out.</text>
<text x="74" y="330" font-size="19" class="s mu" text-anchor="start" >Timestamped speech, screen changes and the exact frames,</text>
<text x="74" y="356" font-size="19" class="s mu" text-anchor="start" >for you or your AI assistant. Local and disposable.</text>
