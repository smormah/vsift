<defs>
<radialGradient id="glow" cx="80%" cy="20%" r="60%"><stop offset="0" stop-color="#2dd4bf" stop-opacity="0.16"/><stop offset="1" stop-color="#2dd4bf" stop-opacity="0"/></radialGradient>
<pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.1" fill="#25405f"/></pattern>
</defs>
<rect width="1280" height="420" rx="28" fill="url(#dots)" opacity="0.6"/>
<rect width="1280" height="420" rx="28" fill="url(#glow)"/>
<g transform="translate(72,74) scale(0.9583333333333334)">
