<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="470" viewBox="0 0 1200 470" role="img" aria-labelledby="title desc" xml:space="preserve">
<title id="title">VSift architecture</title>
<desc id="desc">Five Rust crates with dependencies pointing inward: vsift-cli depends on the vsift engine, which depends on vsift-infrastructure, then vsift-application, then vsift-domain at the centre. The vsift-contract crate sits beside the engine, and hosts depend only on vsift and vsift-contract. FFmpeg, FFprobe and whisper.cpp run as separate external processes. Rules: no shell, no unsafe code, typed errors, verified and size-bounded downloads.</desc>
