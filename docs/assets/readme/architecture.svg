<text x="40" y="320" font-size="14" class="s t b" text-anchor="start" >Rules held in every change</text>
<circle cx="46" cy="344" r="3" fill="#2dd4bf"/>
<text x="58" y="348" font-size="13" class="s mu" text-anchor="start" >No shell: explicit executable and arguments</text>
