<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="title desc" xml:space="preserve">
<title id="title">By hand versus with VSift</title>
<desc id="desc">By hand: play, pause and scrub; screenshot the moments that seem to matter; type up what was said by ear; paste it into notes or an AI chat, and get what someone remembered to write down. With VSift: ingest the recording once, search timestamped speech, list the moments the screen changed, fetch the exact frame, crop or audio clip; every claim points at an id, a time and a hash.</desc>
<style>
.s{font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif} .m{font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, monospace}
.t{fill:#e8eef6} .mu{fill:#9fb2c8} .di{fill:#62799a}
text{white-space:pre} .b{font-weight:600} .bb{font-weight:700}
</style>
<rect width="1200" height="400" rx="20" fill="#0e1a2b"/><rect x="0.5" y="0.5" width="1199" height="399" rx="20" fill="none" stroke="#25405f"/>
<rect x="24" y="24" width="564" height="352" rx="16" fill="#0e1a2b" stroke="#62799a" stroke-opacity="1" stroke-width="1.5"/>
<text x="56" y="66" font-size="13" class="s b" text-anchor="start" fill="#9fb2c8" letter-spacing="1.6">BY HAND</text>
<circle cx="70" cy="107" r="14" fill="none" stroke="#9fb2c8" stroke-opacity="0.8" stroke-width="1.5"/>
<text x="70" y="112" font-size="13" class="s b" text-anchor="middle" fill="#9fb2c8">1</text>
<text x="100" y="112" font-size="16" class="s mu" text-anchor="start" >Play, pause, scrub back and forth</text>
<circle cx="70" cy="159" r="14" fill="none" stroke="#9fb2c8" stroke-opacity="0.8" stroke-width="1.5"/>
<text x="70" y="164" font-size="13" class="s b" text-anchor="middle" fill="#9fb2c8">2</text>
<text x="100" y="164" font-size="16" class="s mu" text-anchor="start" >Screenshot the moments that seem to matter</text>
<circle cx="70" cy="211" r="14" fill="none" stroke="#9fb2c8" stroke-opacity="0.8" stroke-width="1.5"/>
<text x="70" y="216" font-size="13" class="s b" text-anchor="middle" fill="#9fb2c8">3</text>
<text x="100" y="216" font-size="16" class="s mu" text-anchor="start" >Type up what was said, by ear</text>
<circle cx="70" cy="263" r="14" fill="none" stroke="#9fb2c8" stroke-opacity="0.8" stroke-width="1.5"/>
<text x="70" y="268" font-size="13" class="s b" text-anchor="middle" fill="#9fb2c8">4</text>
<text x="100" y="268" font-size="16" class="s mu" text-anchor="start" >Paste it into notes or an AI chat</text>
<line x1="56" y1="308" x2="556" y2="308" stroke="#25405f"/>
<text x="56" y="342" font-size="16" class="s b" text-anchor="start" fill="#9fb2c8">You get what someone remembered to write down.</text>
<rect x="612" y="24" width="564" height="352" rx="16" fill="#13233a" stroke="#2dd4bf" stroke-opacity="0.7" stroke-width="1.5"/>
<text x="644" y="66" font-size="13" class="s b" text-anchor="start" fill="#2dd4bf" letter-spacing="1.6">WITH VSIFT</text>
<circle cx="658" cy="107" r="14" fill="none" stroke="#2dd4bf" stroke-opacity="0.8" stroke-width="1.5"/>
<text x="658" y="112" font-size="13" class="s b" text-anchor="middle" fill="#2dd4bf">1</text>
<text x="688" y="112" font-size="16"><tspan class="m t">vsift ingest</tspan><tspan class="s t"> the recording, once</tspan></text>
<circle cx="658" cy="159" r="14" fill="none" stroke="#2dd4bf" stroke-opacity="0.8" stroke-width="1.5"/>
<text x="658" y="164" font-size="13" class="s b" text-anchor="middle" fill="#2dd4bf">2</text>
<text x="688" y="164" font-size="16" class="s t" text-anchor="start" >Search timestamped speech</text>
<circle cx="658" cy="211" r="14" fill="none" stroke="#2dd4bf" stroke-opacity="0.8" stroke-width="1.5"/>
<text x="658" y="216" font-size="13" class="s b" text-anchor="middle" fill="#2dd4bf">3</text>
<text x="688" y="216" font-size="16" class="s t" text-anchor="start" >List the moments the screen changed</text>
<circle cx="658" cy="263" r="14" fill="none" stroke="#2dd4bf" stroke-opacity="0.8" stroke-width="1.5"/>
<text x="658" y="268" font-size="13" class="s b" text-anchor="middle" fill="#2dd4bf">4</text>
<text x="688" y="268" font-size="16" class="s t" text-anchor="start" >Fetch the exact frame, crop or audio clip</text>
<line x1="644" y1="308" x2="1144" y2="308" stroke="#25405f"/>
<text x="644" y="342" font-size="16" class="s b" text-anchor="start" fill="#2dd4bf">Every claim points at an id, a time and a hash.</text>
<circle cx="600" cy="200.0" r="22" fill="#0e1a2b" stroke="#25405f" stroke-width="1.5"/>
<path d="M591 200.0 H607 M601 194.0 L608 200.0 L601 206.0" fill="none" stroke="#2dd4bf" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
