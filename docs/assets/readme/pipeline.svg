<text x="64" y="147" font-size="15" class="s t b" text-anchor="start" >Local video</text>
<text x="64" y="169" font-size="12.5" class="s mu" text-anchor="start" >the recording stays</text>
<text x="64" y="187" font-size="12.5" class="s mu" text-anchor="start" >the authority</text>
<rect x="48" y="216" width="176" height="74" rx="12" fill="#13233a" stroke="#25405f" stroke-opacity="1" stroke-width="1.5" stroke-dasharray="6 5"/>
<text x="64" y="245" font-size="15" class="s t b" text-anchor="start" >Transcript</text>
<text x="64" y="267" font-size="12.5" class="s mu" text-anchor="start" >optional .srt / .vtt</text>
<rect x="262" y="164" width="150" height="64" rx="12" fill="#13233a" stroke="#25405f" stroke-opacity="1" stroke-width="1.5"/>
<text x="278" y="193" font-size="15" class="m t b" text-anchor="start" >vsift ingest</text>
<text x="278" y="215" font-size="12.5" class="s mu" text-anchor="start" >probe, hash, open</text>
<rect x="450" y="152" width="160" height="88" rx="12" fill="#13233a" stroke="#25405f" stroke-opacity="1" stroke-width="1.5"/>
<text x="466" y="181" font-size="15" class="s t b" text-anchor="start" >Session</text>
<text x="466" y="203" font-size="12.5" class="s mu" text-anchor="start" >disposable: expires</text>
<text x="466" y="221" font-size="12.5" class="s mu" text-anchor="start" >unless you retain it</text>
<rect x="650" y="100" width="186" height="78" rx="12" fill="#13233a" stroke="#2dd4bf" stroke-opacity="0.8" stroke-width="1.5"/>
<circle cx="670" cy="124" r="4.5" fill="#2dd4bf"/>
<text x="682" y="129" font-size="15" class="s t b" text-anchor="start" >Speech</text>
<text x="666" y="151" font-size="12.5" class="s mu" text-anchor="start" >transcript, search</text>
<text x="666" y="169" font-size="12.5" class="s mu" text-anchor="start" >local whisper.cpp or import</text>
<rect x="650" y="202" width="186" height="78" rx="12" fill="#13233a" stroke="#f5b942" stroke-opacity="0.8" stroke-width="1.5"/>
<circle cx="670" cy="226" r="4.5" fill="#f5b942"/>
<text x="682" y="231" font-size="15" class="s t b" text-anchor="start" >Screen changes</text>
<text x="666" y="253" font-size="12.5" class="s mu" text-anchor="start" >visual candidates</text>
<text x="666" y="271" font-size="12.5" class="s mu" text-anchor="start" >with honest coverage</text>
<rect x="650" y="304" width="186" height="78" rx="12" fill="#13233a" stroke="#25405f" stroke-opacity="1" stroke-width="1.5"/>
<text x="666" y="333" font-size="15" class="s t b" text-anchor="start" >Frames · crops · audio</text>
<text x="666" y="355" font-size="12.5" class="s mu" text-anchor="start" >requested and actual time</text>
<text x="666" y="373" font-size="12.5" class="s mu" text-anchor="start" >hash tied to the source</text>
<rect x="450" y="412" width="186" height="74" rx="12" fill="#13233a" stroke="#25405f" stroke-opacity="1" stroke-width="1.5"/>
<text x="466" y="441" font-size="15" class="m t b" text-anchor="start" >vsift handoff check</text>
<text x="466" y="463" font-size="12.5" class="s mu" text-anchor="start" >citations exist, vocabulary</text>
<text x="466" y="481" font-size="12.5" class="s mu" text-anchor="start" >closed, links handled safely</text>
<rect x="900" y="150" width="270" height="110" rx="14" fill="#172a44" stroke="#a78bfa" stroke-opacity="0.8" stroke-width="1.5"/>
<circle cx="922" cy="176" r="4.5" fill="#a78bfa"/>
<text x="934" y="181" font-size="15" class="s t b" text-anchor="start" >Your coding agent</text>
<text x="918" y="206" font-size="12.5" class="s mu" text-anchor="start" >reads cited evidence through the CLI;</text>
<text x="918" y="224" font-size="12.5" class="s mu" text-anchor="start" >what it does with it next is up to</text>
<text x="918" y="242" font-size="12.5" class="s mu" text-anchor="start" >the agent and its settings</text>
<rect x="900" y="412" width="270" height="74" rx="12" fill="#13233a" stroke="#2dd4bf" stroke-opacity="0.8" stroke-width="1.5"/>
<circle cx="920" cy="436" r="4.5" fill="#2dd4bf"/>
<text x="932" y="441" font-size="15" class="s t b" text-anchor="start" >Cited handoff</text>
<text x="916" y="463" font-size="12.5" class="s mu" text-anchor="start" >every statement points at an id,</text>
<text x="916" y="481" font-size="12.5" class="s mu" text-anchor="start" >a time and the original frame</text>
