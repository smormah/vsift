<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="540" viewBox="0 0 1200 540" role="img" aria-labelledby="title desc" xml:space="preserve">
<title id="title">How VSift works</title>
<desc id="desc">Inside a dashed boundary labelled on your machine, VSift uploads nothing: a local video and an optional transcript go into vsift ingest, which opens a disposable session. The session yields speech (transcript and search) and screen changes (visual candidates), which lead to frames, crops and audio with hashes. Outside the boundary, your coding agent reads that cited evidence; what it does next is up to the agent. Its draft report goes back through vsift handoff check and comes out as a cited handoff.</desc>
<style>
.s{font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif} .m{font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, monospace}
.t{fill:#e8eef6} .mu{fill:#9fb2c8} .di{fill:#62799a}
text{white-space:pre} .b{font-weight:600} .bb{font-weight:700}
</style>
