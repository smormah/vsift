<text x="40" y="50" font-size="12.5" class="s b" text-anchor="start" fill="#2dd4bf" letter-spacing="1.6">HOW IT WORKS</text>
<rect x="24" y="76" width="836" height="440" rx="18" fill="#2dd4bf" fill-opacity="0.03" stroke="#2dd4bf" stroke-opacity="0.55" stroke-width="1.5" stroke-dasharray="8 7"/>
