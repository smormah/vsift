<text x="914" y="259" font-size="13" class="s mu" text-anchor="middle">and whisper.cpp re-pins</text>
<circle cx="1091" cy="170" r="12" fill="#0e1a2b" stroke="#a78bfa" stroke-opacity="0.8" stroke-width="2.5"/>
<text x="1091" y="214" font-size="17" class="s bb" text-anchor="middle" fill="#9fb2c8">P15 – P20</text>
<text x="1091" y="240" font-size="13" class="s mu" text-anchor="middle">cross-video indexing,</text>
<text x="1091" y="259" font-size="13" class="s mu" text-anchor="middle">enrichment, workers,</text>
<text x="1091" y="278" font-size="13" class="s mu" text-anchor="middle">online video links</text>
<text x="40" y="338" font-size="12.5" class="s di">Planned steps are plans, not dates. What is not done yet is listed in the known-limits register.</text>
