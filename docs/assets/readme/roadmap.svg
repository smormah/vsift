<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" role="img" aria-labelledby="title desc" xml:space="preserve">
<title id="title">VSift roadmap</title>
<desc id="desc">VSift roadmap in four parts. R0, done: work packets P00 to P14, each with its evidence, and 0.2.0, the R0 release, on 10 October 2026. The 0.2.x line: 0.2.3 now, on npm latest, with Windows fixes, a whisper.cpp update and tests on real recordings; next, 0.2.4 with the FFmpeg update. 0.3.0, planned: on-screen text, speakers, online links, clock times, what changed on screen, search across kept sessions and progress on long recordings. Then 1.0.0, planned, with the first promise of API stability, and work packets P15 to P20 for cross-video indexing, enrichment and workers. Planned steps are plans, not dates.</desc>
<style>
.s{font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif} .m{font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, monospace}
.t{fill:#e8eef6} .mu{fill:#9fb2c8} .di{fill:#62799a}
text{white-space:pre} .b{font-weight:600} .bb{font-weight:700}
@keyframes pulse{0%{transform:scale(1);opacity:.9}100%{transform:scale(2.2);opacity:0}}.pulse{transform-box:fill-box;transform-origin:center;animation:pulse 2.2s ease-out infinite}@media (prefers-reduced-motion: reduce){.pulse{animation:none;opacity:0}}</style>
