<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc" xml:space="preserve">
<title id="title">VSift roadmap</title>
<desc id="desc">VSift roadmap in three parts. R0, done: work packets P00 to P14, each with its evidence; the first pre-release, 0.1.0, on npm on 1 October 2026; and 0.2.0, the R0 release, on 10 October 2026. The 0.2.x line: 0.2.1 now, on npm latest, with transcription fixes and brief JSON views; next, 0.2.2 with Windows fixes first; then 0.2.3 with real-media tests and re-pins of FFmpeg and whisper.cpp. R1, planned: work packets P15 to P20, for cross-video indexing, enrichment, workers and online video links. Planned steps are plans, not dates.</desc>
<style>
.s{font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif} .m{font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, monospace}
.t{fill:#e8eef6} .mu{fill:#9fb2c8} .di{fill:#62799a}
text{white-space:pre} .b{font-weight:600} .bb{font-weight:700}
@keyframes pulse{0%{transform:scale(1);opacity:.9}100%{transform:scale(2.2);opacity:0}}.pulse{transform-box:fill-box;transform-origin:center;animation:pulse 2.2s ease-out infinite}@media (prefers-reduced-motion: reduce){.pulse{animation:none;opacity:0}}</style>
