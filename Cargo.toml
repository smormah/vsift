[workspace]
members = [
  "crates/vsift-application",
  "crates/vsift-cli",
  "crates/vsift-domain",
  "crates/vsift-infrastructure",
  "tools/vsift-governance",
]
default-members = ["crates/vsift-cli"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
authors = ["VSift contributors"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/smormah/vsift"
homepage = "https://github.com/smormah/vsift"
readme = "README.md"

[workspace.dependencies]
assert_cmd = "2.1"
clap = { version = "4.5", features = ["derive"] }
predicates = "3.1"
proptest = { version = "1.11", default-features = false, features = ["std"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.48", features = ["macros", "process", "rt-multi-thread", "time"] }
vsift-application = { version = "0.1.0", path = "crates/vsift-application" }
vsift-domain = { version = "0.1.0", path = "crates/vsift-domain" }
vsift-infrastructure = { version = "0.1.0", path = "crates/vsift-infrastructure" }

[workspace.lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
dbg_macro = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unwrap_used = "deny"

[profile.release]
codegen-units = 1
lto = "thin"
strip = "symbols"
