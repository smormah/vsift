[workspace]
members = [
  "crates/vsift",
  "crates/vsift-application",
  "crates/vsift-cli",
  "crates/vsift-contract",
  "crates/vsift-domain",
  "crates/vsift-infrastructure",
  "crates/vsift-ocr-runner",
  "crates/vsift-windows-security",
  "tools/p10-crash-campaign",
  "tools/vsift-agent-trials",
  "tools/vsift-governance",
  "tools/vsift-release",
]
default-members = ["crates/vsift-cli"]
# The cargo-fuzz harness has its own nightly-only workspace and lockfile.
exclude = ["fuzz"]
resolver = "3"

[workspace.package]
version = "0.2.3-rc.1"
edition = "2024"
rust-version = "1.99"
authors = ["VSift contributors"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/smormah/vsift"
homepage = "https://github.com/smormah/vsift"
readme = "README.md"

[workspace.dependencies]
assert_cmd = "2.1"
# sherpa-onnx publishes every prebuilt archive as .tar.bz2 (ADR 0031, ADR 0032).
# The default back end is libbz2-rs-sys, a Rust port of libbzip2 (no C build),
# maintained by the Trifecta Tech Foundation with bzip2 itself. Its licence is
# bzip2-1.0.6, allowed for that crate alone in deny.toml.
bzip2 = { version = "=0.6.1" }
flate2 = { version = "=1.1.10", default-features = false, features = ["rust_backend"] }
getrandom = "0.4"
jsonschema = { version = "0.58", default-features = false }
lzma-rust2 = { version = "=0.22.0", default-features = false, features = ["std", "xz"] }
# Already in the lock through reqwest's native-tls transport; named directly
# so a managed download can tell a TLS failure from other transport failures
# by type (P13), and so the D-07 test server can present an untrusted
# certificate. No new crate.
native-tls = { version = "0.2", default-features = false }
cap-fs-ext = "=4.0.3"
cap-std = "=4.0.3"
# Windows only: the free space of a session root's volume, for the checks
# before a source copy (#266, ADR 0021 note of 2026-10-17). Its only Windows
# dependency, windows-sys 0.61, is already in the lock; without default
# features it is the filesystem-statistics functions alone (no locks).
fs4 = { version = "=1.1.0", default-features = false }
clap = { version = "4.5", features = ["derive"] }
predicates = "3.1"
process-wrap = { version = "10.0", default-features = false, features = ["creation-flags", "job-object", "kill-on-drop", "process-group", "tokio1"] }
reqwest = { version = "=0.13.5", default-features = false, features = ["native-tls"] }
proptest = { version = "1.11", default-features = false, features = ["std"] }
# The OCR runner only (ADR 0030 decision 1): ONNX Runtime's C API through its
# safe wrapper, loaded at run time from the runner's own folder (`load-dynamic`,
# which brings `libloading`), never linked at build time and never downloaded by
# the build (no default features: no `download-binaries`, no TLS, no `ndarray`).
# rc.13 rather than the newest: the newest was under two weeks old at review.
ort = { version = "=2.0.0-rc.13", default-features = false, features = ["load-dynamic"] }
# The 17 patterns of the skill-owned handoff schema (P13 PR 5, ADR 0023 note of
# 2026-09-30). Without the Unicode tables: the patterns use explicit ranges only.
regex = { version = "1.13", default-features = false, features = ["std"] }
rustix = { version = "1.1", default-features = false, features = ["fs", "process"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = { version = "0.11", default-features = false }
tar = { version = "=0.4.46", default-features = false }
time = { version = "0.3", features = ["formatting"] }
tokio = { version = "1.48", features = ["fs", "io-util", "macros", "process", "rt-multi-thread", "signal", "sync", "time"] }
vsift = { version = "0.2.3-rc.1", path = "crates/vsift" }
vsift-application = { version = "0.2.3-rc.1", path = "crates/vsift-application" }
vsift-contract = { version = "0.2.3-rc.1", path = "crates/vsift-contract" }
vsift-domain = { version = "0.2.3-rc.1", path = "crates/vsift-domain" }
vsift-infrastructure = { version = "0.2.3-rc.1", path = "crates/vsift-infrastructure" }
vsift-windows-security = { version = "0.2.3-rc.1", path = "crates/vsift-windows-security" }
windows-acl = "=0.3.0"
# Windows only, in the one crate allowed `unsafe` (ADR 0026): CreateDirectoryW
# with a security descriptor, and the SDDL conversion and LocalFree it needs;
# and (its amendment of 2026-10-27, L-229) CreateProcessW with an explicit
# handle-inheritance list and the process calls around it, which
# `Win32_System_Threading` holds. Already in the lock at this exact version
# (fs4, process-wrap, tokio and others resolve it); named directly only for
# those functions. No new crate.
windows-sys = { version = "=0.61.2", default-features = false, features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_Storage_FileSystem",
  "Win32_System_Threading",
] }
# Already in the lock through process-wrap's Job Object support, with the same
# version and the same feature; named directly only for the type of the
# provider's creation flags (`CREATE_NO_WINDOW`, a console of its own, #404).
# No new crate.
windows = { version = "0.62.2", features = ["Win32_System_Threading"] }
# The governance checker's workflow lint (P13 PR 8): parses .github/workflows/*.yml
# into a tree, so flow mappings and anchors cannot hide a permission or an
# unpinned action from a line-based scan. Never a dependency of a shipped crate.
yaml-rust2 = { version = "0.13", default-features = false }

[workspace.lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
dbg_macro = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unwrap_used = "deny"

[profile.release]
codegen-units = 1
lto = "thin"
strip = "symbols"

# The crash campaign's negative-control build (tools/p10-crash-campaign): release
# speed, but with debug assertions, without which the durability-campaign feature
# refuses to compile. Never used for anything shipped.
[profile.campaign]
inherits = "release"
debug-assertions = true
overflow-checks = true
