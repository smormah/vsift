[advisories]
ignore = []

[licenses]
include-dev = true
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "MIT",
  "MIT-0",
  "Unicode-3.0",
  "Zlib",
]
confidence-threshold = 0.8
unused-allowed-license = "allow"
exceptions = [
  # Declared for the vendored LLVM libFuzzer sources (whose files now carry
  # Apache-2.0 WITH LLVM-exception headers); used only by the unpublished fuzz
  # harness in fuzz/, never by a VSift crate. Approved by the maintainer on 2026-09-25.
  { crate = "libfuzzer-sys", allow = ["NCSA"] },
  # The bzip2 decoder behind the managed installer's .tar.bz2 reader (ADR 0032):
  # libbz2-rs-sys is a Rust port of libbzip2 under libbzip2's own permissive
  # licence. Pending the maintainer's approval at the review of the pull request
  # that adds it.
  { crate = "libbz2-rs-sys", allow = ["bzip2-1.0.6"] },
]

[bans]
multiple-versions-include-dev = true
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"
workspace-default-features = "allow"
external-default-features = "allow"
allow = []
allow-workspace = true
deny = []
skip = []
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
