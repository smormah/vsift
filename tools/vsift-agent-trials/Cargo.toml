[package]
name = "vsift-agent-trials"
description = "Named-client agent trial harness and grader for the VSift skill (P12, ADR 0022 decision 7)"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
# A qualification harness, like the governance checker and the crash
# campaign: never published and never shipped. It prepares trial
# workspaces, runs a named coding-agent client with an explicit executable
# and argument list, and grades the client's event stream against the frozen
# corpus truth and the skill's own command policy.
publish = false

[[bin]]
name = "vsift-agent-trials"
path = "src/main.rs"

# A stand-in for Claude Code and Codex that replays a recorded event stream.
# The harness's `run` tests drive it instead of a real client, so no test
# ever sends a prompt to a model provider.
[[bin]]
name = "vsift-trials-stub-client"
path = "src/bin/stub_client.rs"

[dependencies]
clap.workspace = true
getrandom.workspace = true
# Cross-checks every handoff verdict of the shared check (P13 PR 5).
jsonschema.workspace = true
process-wrap.workspace = true
serde.workspace = true
# `raw_value` lets the harness rewrite one member of Claude Code's
# `.claude.json` while copying every other member back byte for byte
# (`claude_trust`); it adds a type, not a dependency.
serde_json = { workspace = true, features = ["raw_value"] }
sha2.workspace = true
tokio.workspace = true
vsift.workspace = true
# The shared handoff check (P13 PR 5): the grader and `vsift handoff check`
# run the same code.
vsift-contract.workspace = true

[lints]
workspace = true
