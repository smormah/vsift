# cargo-about configuration for the THIRD-PARTY-NOTICES file in every release
# archive (P13 PR 8, ADR 0023). The release workflow runs cargo-about offline
# over the `vsift` binary's crate for one target at a time, so each archive's
# notices cover exactly the crates linked into that target's binary.
#
# The accepted licences are deny.toml's allow list; a crate under any other
# licence fails the notices step, as it fails `cargo deny check`.
accepted = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "MIT",
  "MIT-0",
  "Unicode-3.0",
  "Zlib",
]
ignore-build-dependencies = true
ignore-dev-dependencies = true
# The workflow passes --offline: licence texts come only from the crate sources
# the lockfile names, and no licence service is contacted.
