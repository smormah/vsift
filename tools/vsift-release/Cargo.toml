[package]
name = "vsift-release"
description = "Packages and checks VSift's native release archives and SHA256SUMS (P13, ADR 0023); never shipped"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
# A release-pipeline tool, like the governance checker: never published and
# never part of an archive. It shares the workspace version, which is the
# version of the `vsift` binary it packages (a test holds both to it).
publish = false

[dependencies]
clap.workspace = true
flate2.workspace = true
serde_json.workspace = true
sha2.workspace = true
tar.workspace = true

[lints]
workspace = true
