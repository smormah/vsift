[package]
name = "vsift-crash-campaign"
description = "The Ubuntu 24.04 / ext4 durable-publication crash campaign (P10, ADR 0020): workload, verifier and dm-log-writes replay"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
# A qualification harness, like the governance checker: never published and
# never shipped. It drives the session store and the application use cases
# directly (as the storage tests do) with deterministic stand-ins for media
# and speech, so no FFmpeg or whisper.cpp is needed.
publish = false

[features]
# Builds the store with the campaign's negative control (and, before the
# campaign constant was set, the qualified profile). Never a default: the
# infrastructure crate refuses it without debug assertions, and the
# governance check allows it only here and in development dependencies.
campaign = ["vsift-infrastructure/durability-campaign"]

[dependencies]
clap.workspace = true
serde_json.workspace = true
sha2.workspace = true
tokio.workspace = true
vsift.workspace = true
vsift-application.workspace = true
vsift-domain.workspace = true
vsift-infrastructure.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
# `tcdrain` on the serial port that carries acknowledgements out of a guest,
# so an acknowledgement has reached the host before the next operation
# starts. The termios feature adds no crate to the lockfile.
rustix = { workspace = true, features = ["termios"] }

[lints]
workspace = true
