[package]
name = "vsift-fuzz"
description = "cargo-fuzz targets for VSift's untrusted-input parsers (test harness, never published)"
version = "0.0.0"
edition = "2024"
rust-version = "1.98"
license = "MIT OR Apache-2.0"
publish = false

[package.metadata]
cargo-fuzz = true

# Deliberately outside the repository workspace (the root manifest excludes this
# directory): libFuzzer needs a nightly toolchain and sanitizer flags, and the
# stable workspace checks must not depend on either. Its own `Cargo.lock` is
# committed so `--locked` works here too.
[workspace]

[features]
# The libFuzzer entry points (`fuzz_targets/`). Off by default so the stable
# replay tests build without libFuzzer's C++ runtime; `cargo fuzz` passes
# `--features libfuzzer` (see "Fuzzing" in docs/development.md).
libfuzzer = ["dep:libfuzzer-sys"]

[dependencies]
libfuzzer-sys = { version = "0.4.13", optional = true }
# The `handoff_check` target reads the published form of a check (P13 PR 5).
serde_json = "1.0.151"
# The `bundle_manifest` target (P14 PR 4) names each artifact it invents by its
# SHA-256, as the store does. The workspace's version and settings.
sha2 = { version = "0.11", default-features = false }
vsift-contract = { version = "0.2.1-rc.1", path = "../crates/vsift-contract" }
vsift-domain = { version = "0.2.1-rc.1", path = "../crates/vsift-domain" }
vsift-infrastructure = { version = "0.2.1-rc.1", path = "../crates/vsift-infrastructure" }

[dev-dependencies]
# Re-derive the local-ASR and visual-index record seeds in the replay tests;
# serde_json (a dependency above) reads the recorded visual samples too.
vsift-application = { version = "0.2.1-rc.1", path = "../crates/vsift-application" }
# P14 PR 4: the archive seeds are built the way the infrastructure crate's own
# archive tests build theirs (a tar, then gzip or xz around it), with the
# workspace's pinned versions and settings; all three are already in the graph.
flate2 = { version = "=1.1.10", default-features = false, features = ["rust_backend"] }
lzma-rust2 = { version = "=0.20.1", default-features = false, features = ["std", "xz", "encoder"] }
tar = { version = "=0.4.46", default-features = false }

[[bin]]
name = "request_record"
path = "fuzz_targets/request_record.rs"
test = false
doc = false
bench = false
required-features = ["libfuzzer"]

